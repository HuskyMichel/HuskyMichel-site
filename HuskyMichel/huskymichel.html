<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<link rel="icon" href="Photo de profil/titre.jpg">
<title>HuskyMichel - Réseaux</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#f5f5f5,#e8e8e8);
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  background:white;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.home-img{
  width:140px;
  transition:.3s;
}

.home-img:hover{
  transform:scale(1.08);
}

/* PROFIL */
.profil{
  text-align:center;
  margin-top:30px;
}

.profil img{
  width:175px;
  border-radius:15px;
}

.profil h1{
  margin-top:10px;
}

/* GALERIE */
.galerie{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
  padding:40px;
}

/* CARTES */
.reseau{
  width:280px;
  height:160px;
  border-radius:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  box-shadow:0 10px 25px rgba(0,0,0,.18);
  transition:.3s;

  user-select:none;
}

.reseau:hover{
  transform:translateY(-8px) scale(1.02);
}

.overlay{
  text-align:center;
  color:white;
}

.overlay h2{
  margin-bottom:8px;
}

.overlay p{
  color:white;
  margin-bottom:12px;
}

.btn{
  display:inline-block;
  padding:10px 18px;
  background:black;
  color:white;
  text-decoration:none;
  border-radius:10px;
  transition:.3s;
}

.btn:hover{
  background:#333;
  transform:scale(1.05);
}

/* IMAGES FOND */
.youtube{
  background:
  linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
  url("Photo de profil/youtube.jpg");
}

.twitch{
  background:
  linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
  url("Photo de profil/twitch.jpg");
}

.discord{
  background:
  linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
  url("Photo de profil/discord.jpg");
}

.tiktok{
  background:
  linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
  url("Photo de profil/tiktok.jpg");
}

.youtube-rediff{
  background:
  linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
  url("Photo de profil/youtube-rediff.jpg");
}

/* FOOTER */
.footer{
  margin-top:60px;
  background:white;
  text-align:center;
  padding:30px 20px;

  box-shadow:0 -4px 15px rgba(0,0,0,.1);

  border-top-left-radius:20px;
  border-top-right-radius:20px;
  border-bottom-left-radius:20px;
  border-bottom-right-radius:20px;
}

.don-widget{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:999;
}

.don-content{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  text-align:center;
}

.don-toggle{
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  background:black;
  color:white;
  font-size:24px;
  cursor:pointer;
  margin-bottom:10px;
}

.dons{
  display:flex;
  gap:15px;
  justify-content:center;
}

.paypal-img{
  width:85px;
  border-radius:12px;
}

.merci{
  font-size:13px;
  color:#666;
  margin-top:10px;
}
</style>
</head>

<body>

<script>
function toggleDon(){
  const box = document.getElementById("donContent");

  if(box.style.display === "none"){
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
}
