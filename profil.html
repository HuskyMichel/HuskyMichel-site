<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#1f1f1f;

    color:white;

}


/* =========================
   BARRE DU HAUT
========================= */

header{

    height:60px;

    background:#0f0f0f;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid #2b2b2b;

    position:sticky;

    top:0;

    z-index:1000;

}


/* =========================
   LOGO
========================= */

.logo{

    display:flex;

    align-items:center;

}

.logo img{

    height:42px;

    cursor:pointer;

}


/* =========================
   RECHERCHE
========================= */

.search{

    flex:1;

    display:flex;

    justify-content:center;

}

.search input{

    width:520px;

    max-width:90%;

    padding:11px 18px;

    border-radius:30px;

    border:1px solid #333;

    background:#151515;

    color:white;

    outline:none;

    font-size:15px;

}

.search input:focus{

    border-color:#3ea6ff;

}


/* =========================
   COMPTE
========================= */

.account{

    display:flex;

    align-items:center;

    gap:12px;

}


/* CONNEXION */

#loginBtn{

    background:#3ea6ff;

    color:white;

    border:none;

    border-radius:25px;

    padding:10px 18px;

    cursor:pointer;

    font-size:15px;

}


/* PROFIL */

.profile{

    display:none;

    position:relative;

}

#avatar{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    cursor:pointer;

    border:2px solid white;

    box-shadow:

        0 0 7px white,

        0 0 15px rgba(255,255,255,.7);

}


/* MENU */

.menu{

    display:none;

    position:absolute;

    top:55px;

    right:0;

    width:230px;

    background:#242424;

    border-radius:12px;

    overflow:hidden;

    box-shadow:0 0 20px rgba(0,0,0,.6);

}

.menu a,
.menu button{

    display:block;

    width:100%;

    padding:14px;

    border:none;

    background:none;

    color:white;

    text-align:left;

    text-decoration:none;

    cursor:pointer;

    font-size:15px;

}

.menu a:hover,
.menu button:hover{

    background:#333;

}


/* =========================
   BANNIERE
========================= */

.banner{

    height:280px;

    background:

        linear-gradient(

            to bottom,

            #3a3a3a,

            #292929

        );

}


/* =========================
   CONTENU
========================= */

main{

    max-width:1100px;

    margin:auto;

    padding-bottom:60px;

}


/* =========================
   ENTETE PROFIL
========================= */

.profilHeader{

    position:relative;

    padding:0 40px;

}


.photo{

    width:180px;

    height:180px;

    border-radius:50%;

    object-fit:cover;

    display:block;

    margin-top:-90px;

    border:6px solid #1f1f1f;

    box-shadow:

        0 0 10px white,

        0 0 25px rgba(255,255,255,.8),

        0 0 45px rgba(255,255,255,.35);

}


/* =========================
   INFOS
========================= */

.infos{

    padding:25px 40px;

}


/* PSEUDO */

#pseudo{

    font-size:38px;

    font-weight:bold;

    margin-top:5px;

}


/* DESCRIPTION COURTE */

#descriptionCourte{

    color:#bdbdbd;

    font-size:17px;

    margin-top:10px;

}


/* =========================
   SECTIONS
========================= */

.section{

    margin-top:35px;

    padding:25px;

    background:#292929;

    border-radius:16px;

    border:1px solid #333;

}


.section h2{

    margin-top:0;

    margin-bottom:20px;

}


/* =========================
   DESCRIPTION
========================= */

#descriptionLongue{

    color:#ddd;

    line-height:1.6;

    white-space:pre-wrap;

}


/* =========================
   CATEGORIES
========================= */

#categories{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}


.tag{

    display:inline-block;

    padding:8px 14px;

    background:#3ea6ff;

    color:white;

    border-radius:20px;

    font-size:14px;

    font-weight:bold;

    box-shadow:

        0 0 7px rgba(62,166,255,.3);

}


/* =========================
   VIDEO
========================= */

#videoContainer{

    width:100%;

    overflow:hidden;

    border-radius:14px;

}


#videoContainer iframe{

    display:block;

    width:100%;

    height:500px;

    border:none;

}


/* =========================
   RESEAUX
========================= */

#reseaux{

    display:flex;

    flex-direction:column;

    gap:12px;

}


.reseau{

    padding:14px;

    background:#202020;

    border-radius:10px;

    border:1px solid #333;

}


.reseau strong{

    color:#fff;

}


.reseau a{

    color:#3ea6ff;

    text-decoration:none;

    word-break:break-all;

}


.reseau a:hover{

    text-decoration:underline;

}


/* =========================
   BOUTON RETOUR
========================= */

#retourAccueil{

    margin-top:25px;

    padding:12px 20px;

    background:#3ea6ff;

    border:none;

    border-radius:10px;

    color:white;

    cursor:pointer;

    font-size:15px;

}


#retourAccueil:hover{

    background:#61b8ff;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{

        padding:0 10px;

    }


    .search input{

        width:250px;

    }


    .banner{

        height:180px;

    }


    .profilHeader{

        padding:0 20px;

    }


    .photo{

        width:130px;

        height:130px;

        margin-top:-65px;

    }


    .infos{

        padding:20px;

    }


    #pseudo{

        font-size:30px;

    }


    #videoContainer iframe{

        height:300px;

    }

}

</style>

</head>


<body>


<!-- =========================
     BARRE DU HAUT
========================= -->

<header>


    <div class="logo">

        <img
            src="Photo de profil/titre.jpg"
            id="retourAccueil"
            alt="Accueil"
        >

    </div>


    <div class="search">

        <input
            id="rechercheProfil"
            type="text"
            placeholder="Rechercher un profil..."
        >

    </div>


    <div class="account">


        <button id="loginBtn">

            Se connecter

        </button>


        <div
            id="profile"
            class="profile"
        >

            <img
                id="avatar"
                alt="Compte"
            >


            <div
                id="menu"
                class="menu"
            >

                <a href="index.html">

                    🏠 Accueil

                </a>


                <a href="creation-profil.html">

                    ✏️ Modifier mon profil

                </a>


                <button id="logout">

                    🚪 Déconnexion

                </button>

            </div>

        </div>

    </div>

</header>


<!-- =========================
     BANNIERE
========================= -->

<div class="banner"></div>


<!-- =========================
     PROFIL
========================= -->

<main>


    <div class="profilHeader">

        <img
            id="photo"
            class="photo"
            alt="Photo de profil"
        >

    </div>


    <div class="infos">


        <div id="pseudo">

            Chargement...

        </div>


        <div id="descriptionCourte">

            Chargement...

        </div>


        <!-- =====================
             A PROPOS
        ====================== -->

        <div class="section">

            <h2>

                📖 À propos

            </h2>


            <p id="descriptionLongue">

                Chargement...

            </p>

        </div>


        <!-- =====================
             VIDEO
        ====================== -->

        <div
            id="sectionVideo"
            class="section"
        >

            <h2>

                🎬 Vidéo mise en avant

            </h2>


            <div id="videoContainer"></div>

        </div>


        <!-- =====================
             CATEGORIES
        ====================== -->

        <div class="section">

            <h2>

                🏷️ Catégories

            </h2>


            <div id="categories"></div>

        </div>


        <!-- =====================
             RESEAUX
        ====================== -->

        <div class="section">

            <h2>

                🌐 Réseaux

            </h2>


            <div id="reseaux"></div>

        </div>


        <button id="retourAccueil">

            ← Retour à l'accueil

        </button>


    </div>

</main>


<script
    type="module"
    src="profil.js">
</script>


</body>

</html>
