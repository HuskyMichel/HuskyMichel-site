<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

body{

    font-family:Arial,sans-serif;

    background:#1f1f1f;

    color:white;

    min-height:100vh;

}


/* =========================================================
   BARRE DU HAUT
========================================================= */

header{

    position:sticky;

    top:0;

    z-index:1000;

    height:60px;

    background:#0f0f0f;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid #2b2b2b;

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    display:flex;

    align-items:center;

}

.logo img{

    height:42px;

    width:auto;

    cursor:pointer;

    border-radius:8px;

    transition:.2s;

}

.logo img:hover{

    transform:scale(1.05);

}


/* =========================================================
   RECHERCHE
========================================================= */

.search{

    flex:1;

    display:flex;

    justify-content:center;

    margin:0 25px;

}

.search input{

    width:520px;

    max-width:100%;

    padding:11px 20px;

    border-radius:30px;

    border:1px solid #333;

    background:#151515;

    color:white;

    outline:none;

    font-size:15px;

    transition:.2s;

}

.search input:focus{

    border-color:#3ea6ff;

    box-shadow:0 0 10px rgba(62,166,255,.2);

}

.search input::placeholder{

    color:#888;

}


/* =========================================================
   COMPTE
========================================================= */

.account{

    display:flex;

    align-items:center;

    gap:12px;

}


/* =========================================================
   BOUTON CONNEXION
========================================================= */

#loginBtn{

    background:#3ea6ff;

    color:white;

    border:none;

    border-radius:25px;

    padding:10px 18px;

    font-size:15px;

    cursor:pointer;

    transition:.2s;

}

#loginBtn:hover{

    background:#61b8ff;

    transform:translateY(-1px);

}


/* =========================================================
   PROFIL COMPTE
========================================================= */

.profile{

    display:none;

    position:relative;

}


/* =========================================================
   AVATAR COMPTE
========================================================= */

#avatar{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    cursor:pointer;

    border:2px solid white;

    box-shadow:

        0 0 7px white,

        0 0 15px rgba(255,255,255,.7),

        0 0 25px rgba(255,255,255,.25);

    transition:.2s;

}

#avatar:hover{

    transform:scale(1.06);

}


/* =========================================================
   MENU COMPTE
========================================================= */

.menu{

    display:none;

    position:absolute;

    top:55px;

    right:0;

    width:230px;

    background:#242424;

    border:1px solid #383838;

    border-radius:14px;

    overflow:hidden;

    box-shadow:

        0 10px 35px rgba(0,0,0,.6);

}

.menu a,
.menu button{

    width:100%;

    display:block;

    padding:14px;

    border:none;

    background:none;

    color:white;

    text-align:left;

    text-decoration:none;

    font-size:15px;

    cursor:pointer;

    transition:.15s;

}

.menu a:hover,
.menu button:hover{

    background:#333;

}


/* =========================================================
   BANNIERE
========================================================= */

.banner{

    height:300px;

    background:

        linear-gradient(

            135deg,

            #353535,

            #202020

        );

    position:relative;

    overflow:hidden;

}


/* effet lumineux */

.banner::before{

    content:"";

    position:absolute;

    width:500px;

    height:500px;

    border-radius:50%;

    background:rgba(62,166,255,.08);

    top:-250px;

    left:50%;

    transform:translateX(-50%);

    filter:blur(50px);

}


/* =========================================================
   CONTENEUR PRINCIPAL
========================================================= */

main{

    max-width:1150px;

    margin:auto;

    padding-bottom:70px;

}


/* =========================================================
   EN-TETE DU PROFIL
========================================================= */

.profilHeader{

    position:relative;

    padding:0 45px;

}


/* =========================================================
   PHOTO DE PROFIL
========================================================= */

.photo{

    width:185px;

    height:185px;

    object-fit:cover;

    display:block;

    margin-top:-92px;

    border-radius:50%;

    border:6px solid #1f1f1f;

    background:#222;

    box-shadow:

        0 0 8px white,

        0 0 18px white,

        0 0 35px rgba(255,255,255,.8),

        0 0 60px rgba(255,255,255,.25);

    position:relative;

    z-index:2;

}


/* =========================================================
   INFOS PRINCIPALES
========================================================= */

.infos{

    padding:25px 45px;

}


/* =========================================================
   PSEUDO
========================================================= */

#pseudo{

    font-size:40px;

    font-weight:bold;

    line-height:1.2;

    margin-top:5px;

}


/* =========================================================
   DESCRIPTION COURTE
========================================================= */

#descriptionCourte{

    color:#bdbdbd;

    font-size:17px;

    margin-top:10px;

    line-height:1.5;

}


/* =========================================================
   SECTIONS
========================================================= */

.section{

    margin-top:30px;

    padding:25px;

    background:#292929;

    border:1px solid #363636;

    border-radius:18px;

    box-shadow:

        0 8px 25px rgba(0,0,0,.15);

    transition:.2s;

}

.section:hover{

    border-color:#444;

    transform:translateY(-2px);

}

.section h2{

    margin:0 0 20px 0;

    font-size:22px;

}


/* =========================================================
   DESCRIPTION LONGUE
========================================================= */

#descriptionLongue{

    color:#ddd;

    line-height:1.7;

    font-size:16px;

    white-space:pre-wrap;

}


/* =========================================================
   CATEGORIES
========================================================= */

#categories{

    display:flex;

    flex-wrap:wrap;

    gap:9px;

}


/* =========================================================
   TAG
========================================================= */

.tag{

    display:inline-flex;

    align-items:center;

    padding:9px 15px;

    background:#3ea6ff;

    color:white;

    border-radius:25px;

    font-size:14px;

    font-weight:bold;

    box-shadow:

        0 0 8px rgba(62,166,255,.25);

    transition:.2s;

}

.tag:hover{

    transform:translateY(-2px);

    box-shadow:

        0 0 14px rgba(62,166,255,.45);

}


/* =========================================================
   VIDEO
========================================================= */

#videoContainer{

    width:100%;

    overflow:hidden;

    border-radius:15px;

    background:#111;

    box-shadow:

        0 8px 25px rgba(0,0,0,.35);

}

#videoContainer iframe{

    display:block;

    width:100%;

    height:500px;

    border:none;

}


/* =========================================================
   RESEAUX
========================================================= */

#reseaux{

    display:flex;

    flex-direction:column;

    gap:12px;

}


.reseau{

    padding:15px 17px;

    background:#202020;

    border:1px solid #353535;

    border-radius:12px;

    transition:.2s;

}


.reseau:hover{

    background:#252525;

    border-color:#444;

    transform:translateX(3px);

}


.reseau strong{

    color:white;

    margin-right:5px;

}


.reseau a{

    color:#3ea6ff;

    text-decoration:none;

    word-break:break-all;

}


.reseau a:hover{

    text-decoration:underline;

}


/* =========================================================
   BOUTON RETOUR
========================================================= */

#retourAccueil{

    margin-top:30px;

    padding:12px 22px;

    background:#3ea6ff;

    border:none;

    border-radius:12px;

    color:white;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:.2s;

}

#retourAccueil:hover{

    background:#61b8ff;

    transform:translateY(-2px);

    box-shadow:

        0 5px 15px rgba(62,166,255,.25);

}


/* =========================================================
   CHARGEMENT
========================================================= */

#pseudo:empty::after{

    content:"Chargement...";

    color:#888;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    header{

        height:auto;

        min-height:60px;

        padding:8px 10px;

        gap:8px;

    }


    .logo img{

        height:38px;

    }


    .search{

        margin:0 5px;

    }


    .search input{

        width:100%;

        padding:10px 14px;

        font-size:14px;

    }


    #loginBtn{

        padding:9px 12px;

        font-size:13px;

    }


    #avatar{

        width:38px;

        height:38px;

    }


    .banner{

        height:190px;

    }


    main{

        width:100%;

    }


    .profilHeader{

        padding:0 20px;

    }


    .photo{

        width:135px;

        height:135px;

        margin-top:-67px;

        border-width:5px;

    }


    .infos{

        padding:20px;

    }


    #pseudo{

        font-size:30px;

    }


    #descriptionCourte{

        font-size:15px;

    }


    .section{

        padding:20px;

        border-radius:14px;

    }


    .section h2{

        font-size:20px;

    }


    #videoContainer iframe{

        height:280px;

    }


    .menu{

        right:-5px;

        width:210px;

    }

}


/* =========================================================
   PETITS TELEPHONES
========================================================= */

@media(max-width:450px){

    .search input{

        width:150px;

    }


    #pseudo{

        font-size:27px;

    }


    .photo{

        width:120px;

        height:120px;

        margin-top:-60px;

    }


    #videoContainer iframe{

        height:220px;

    }

}

/* =========================
   RESULTATS DE RECHERCHE
========================= */

.search{
    position:relative;
}

#resultatsRecherche{

    position:absolute;

    top:55px;

    left:50%;

    transform:translateX(-50%);

    width:520px;

    max-width:90%;

    background:#242424;

    border-radius:12px;

    overflow:hidden;

    box-shadow:0 8px 25px rgba(0,0,0,.5);

    z-index:2000;

    display:none;
}


/* =========================
   RESULTAT
========================= */

.resultatRecherche{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:10px 15px;

    cursor:pointer;

    transition:.15s;

}


.resultatRecherche:hover{

    background:#333;

}


/* =========================
   PSEUDO
========================= */

.resultatRecherchePseudo{

    font-size:16px;

    font-weight:bold;

    color:white;

    transition:transform .2s ease;

}


/* =========================
   PHOTO
========================= */

.resultatRecherche img{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid white;

    box-shadow:
        0 0 6px white,
        0 0 12px rgba(255,255,255,.6);

    transition:transform .2s ease;

}


/* =========================
   ZOOM AU SURVOL
========================= */

.resultatRecherche:hover
.resultatRecherchePseudo{

    transform:scale(1.05);

}


.resultatRecherche:hover img{

    transform:scale(1.12);

}

</style>

</head>


<body>


<!-- =======================================================
     BARRE DU HAUT
======================================================= -->

<header>


    <div class="logo">

        <img
            src="Photo de profil/titre.jpg"
            id="logoAccueil"
            alt="Accueil"
        >

    </div>


    <div class="search">

    <input
        id="rechercheProfil"
        type="text"
        placeholder="🔍 Rechercher un profil..."
    >

    <div id="resultatsRecherche"></div>

</div>


    <div class="account">


        <button id="loginBtn">

            Se connecter

        </button>


        <div
            id="profile"
            class="profile"
        >

            <img
                id="avatar"
                alt="Compte"
            >


            <div
                id="menu"
                class="menu"
            >

                <a href="index.html">

                    🏠 Accueil

                </a>


                <a href="creation-profil.html">

                    ✏️ Modifier mon profil

                </a>


                <button id="logout">

                    🚪 Déconnexion

                </button>

            </div>

        </div>

    </div>

</header>


<!-- =======================================================
     BANNIERE
======================================================= -->

<div class="banner"></div>


<!-- =======================================================
     PROFIL
======================================================= -->

<main>


    <div class="profilHeader">

        <img
            id="photo"
            class="photo"
            alt="Photo de profil"
        >

    </div>


    <div class="infos">


        <div id="pseudo">

            Chargement...

        </div>


        <div id="descriptionCourte">

            Chargement...

        </div>


        <!-- =================================================
             A PROPOS
        ================================================== -->

        <div class="section">

            <h2>

                📖 À propos

            </h2>


            <p id="descriptionLongue">

                Chargement...

            </p>

        </div>


        <!-- =================================================
             VIDEO
        ================================================== -->

        <div
            id="sectionVideo"
            class="section"
        >

            <h2>

                🎬 Vidéo mise en avant

            </h2>


            <div id="videoContainer"></div>

        </div>


        <!-- =================================================
             CATEGORIES
        ================================================== -->

        <div class="section">

            <h2>

                🏷️ Catégories

            </h2>


            <div id="categories"></div>

        </div>


        <!-- =================================================
             RESEAUX
        ================================================== -->

        <div class="section">

            <h2>

                🌐 Réseaux

            </h2>


            <div id="reseaux"></div>

        </div>


        <!-- =================================================
             RETOUR
        ================================================== -->

        <button id="retourAccueil">

            ← Retour à l'accueil

        </button>


    </div>

</main>


<!-- =======================================================
     JAVASCRIPT
======================================================= -->

<script
    type="module"
    src="profil.js">
</script>


</body>

</html>
