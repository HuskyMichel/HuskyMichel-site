<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>HuskyMichel Community</title>

<link rel="icon" href="img/logo.jpg">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#202020;

color:white;

transition:0.4s;

}

/* ================= TOPBAR ================= */

.topbar{

position:fixed;

top:0;
left:0;

width:100%;

height:75px;

background:#111;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:0 5px 20px rgba(0,0,0,.35);

}

.logo{

height:50px;

cursor:pointer;

}

.recherche{

width:400px;

padding:12px;

border:none;

outline:none;

border-radius:12px;

background:#2f3136;

color:white;

font-size:15px;

}

.recherche::placeholder{

color:#aaa;

}

/* ================= BOUTONS ================= */

.actions{

display:flex;

gap:15px;

align-items:center;

}

.btn{

padding:10px 18px;

border:none;

border-radius:10px;

background:#5865F2;

color:white;

cursor:pointer;

font-size:14px;

transition:.25s;

}

.btn:hover{

transform:translateY(-2px);

background:#4752c4;

}

/* ================= CATEGORIES ================= */

.categories{

margin-top:110px;

display:flex;

gap:12px;

padding:20px;

overflow-x:auto;

}

.categories::-webkit-scrollbar{

display:none;

}

.categorie{

padding:10px 18px;

background:#2f3136;

border-radius:12px;

cursor:pointer;

transition:.3s;

white-space:nowrap;

}

.categorie:hover{

background:#5865F2;

}

.categorie.active{

background:#5865F2;

}

/* ================= PROFILS ================= */

.container{

padding:30px;

display:grid;

grid-template-columns:

repeat(auto-fill,minmax(220px,1fr));

gap:20px;

}

.profil{

background:#2f3136;

border-radius:18px;

padding:15px;

text-align:center;

transition:.3s;

}

.profil:hover{

transform:translateY(-6px);

}

.profil img{

width:90px;

height:90px;

border-radius:50%;

object-fit:cover;

margin-bottom:10px;

}

.nom{

font-size:18px;

font-weight:bold;

margin-bottom:8px;

}

.tag{

display:inline-block;

padding:5px 12px;

border-radius:999px;

background:#40444b;

font-size:12px;

margin-top:6px;

}

.voir{

margin-top:12px;

display:inline-block;

padding:10px 16px;

background:#5865F2;

border-radius:10px;

text-decoration:none;

color:white;

font-size:14px;

}

.voir:hover{

background:#4752c4;

}

/* ================= CREER PROFIL ================= */

.createBtn{

position:fixed;

right:25px;

bottom:25px;

width:65px;

height:65px;

border:none;

border-radius:50%;

font-size:30px;

background:#5865F2;

color:white;

cursor:pointer;

box-shadow:0 8px 25px rgba(0,0,0,.4);

}

.createBtn:hover{

transform:scale(1.05);

}

/* ================= MODAL ================= */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.7);

justify-content:center;

align-items:center;

z-index:3000;

}

.modal-content{

width:500px;

background:#2f3136;

padding:25px;

border-radius:20px;

}

/* ================= MODAL ================= */

.modal-content h2{

margin-bottom:20px;

text-align:center;

}

.input{

width:100%;

padding:12px;

border:none;

border-radius:12px;

margin-bottom:15px;

background:#40444b;

color:white;

font-size:15px;

outline:none;

}

.input::placeholder{

color:#aaa;

}

textarea.input{

resize:none;

height:90px;

}

.categoriesSelect{

display:flex;

flex-wrap:wrap;

gap:10px;

margin-bottom:20px;

}

.catSelect{

padding:10px 14px;

background:#40444b;

border-radius:10px;

cursor:pointer;

transition:.25s;

}

.catSelect:hover{

background:#5865F2;

}

.catSelect.selected{

background:#5865F2;

}

.colorBox{

display:flex;

gap:12px;

margin-top:15px;

margin-bottom:20px;

}

.color{

width:35px;

height:35px;

border-radius:50%;

cursor:pointer;

border:3px solid transparent;

}

.color.active{

border-color:white;

}

.save{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#5865F2;

color:white;

font-size:16px;

cursor:pointer;

}

.save:hover{

background:#4752c4;

}

.close{

position:absolute;

right:20px;

top:15px;

font-size:24px;

cursor:pointer;

}

.hidden{

display:none;

}

</style>

</head>

<body>

<div class="topbar">

<img
src="img/logo.png"
class="logo">

<input

type="text"

id="search"

class="recherche"

placeholder="🔍 Rechercher un profil..."

>

<div class="actions">

<button

class="btn"

id="loginBtn">

Connexion

</button>

<button

class="btn"

id="profilBtn"

style="display:none;">

Profil

</button>

</div>

</div>

<div class="categories">

<div class="categorie active">

</div>

<div class="categorie">

</div>

<div class="categorie">

</div>

<div class="categorie">

</div>

<div class="categorie">

</div>

<div class="categorie">

Streamer

</div>

<div class="categorie">

Créateur

</div>

</div>

<div

class="container"

id="profils">

</div>

<button

id="createBtn"

class="createBtn">

+

</button>

<div

class="modal">

<div class="modal-content">

<span

id="closeModal"

class="close">

<h2>

placeholder="Description">

<h3>

<div class="categoriesSelect">

</div>

<div class="catSelect">

</div>

<h3>

Couleur du profil

</h3>

<div class="colorBox">

<div

class="color"

style="background:#5865F2">

</div>

<div
class="color"
style="background:#57F287">
</div>

<div
class="color"
style="background:#ED4245">
</div>

<div
class="color"
style="background:#FAA61A">
</div>

<div
class="color"
style="background:#EB459E">
</div>

<div
class="color"
style="background:#00C3FF">
</div>

<div
class="color"
style="background:#7289DA">
</div>

</div>

<button

id="saveProfil"

class="save">

Publier mon profil

</button>

</div>

</div>

<script>

const modal =
document.getElementById("modal")

const createBtn =
document.getElementById("createBtn")

const closeModal =
document.getElementById("closeModal")

createBtn.onclick = ()=>{

modal.style.display = "flex"

}

closeModal.onclick = ()=>{

modal.style.display = "none"

}

window.onclick = (e)=>{

if(e.target===modal){

modal.style.display = "none"

}

}

</script>

<script>

const categoriesChoisies = []

document.querySelectorAll(".catSelect")

.forEach(cat=>{

cat.onclick = ()=>{

cat.classList.toggle("selected")

const nom = cat.innerText

if(categoriesChoisies.includes(nom)){

const index =

categoriesChoisies.indexOf(nom)

categoriesChoisies.splice(index,1)

}

else{

categoriesChoisies.push(nom)

}

}

})

</script>

<script>

let couleurProfil = "#5865F2"

document.querySelectorAll(".color")

.forEach(c=>{

c.onclick = ()=>{

document

.querySelectorAll(".color")

.forEach(x=>{

x.classList.remove("active")

})

c.classList.add("active")

couleurProfil =

window.getComputedStyle(c)

.backgroundColor

}

})

</script>

<script>

let profils = []

function afficherProfils(){

const zone =

document.getElementById("profils")

zone.innerHTML = ""

profils.forEach(p=>{

zone.innerHTML += `

<div
class="profil">

<img src="${p.photo}">

<div class="nom">

${p.nom}

</div>

<div class="tag">

${p.categories.join(", ")}

</div>

<a

href="${p.lien}"

class="voir">

Voir

</a>

</div>

`

})

}

</script>

<script>

document

.getElementById("saveProfil")

.onclick = ()=>{

const nom =

document.getElementById("pseudo")

.value

const photo =

document.getElementById("photo")

.value

const lien =

document.getElementById("profilLink")

.value

const description =

document.getElementById("description")

.value

if(nom===""){

alert("Pseudo requis")

return

}

const nouveauProfil = {

nom,

photo,

lien,

description,

categories:

[...categoriesChoisies],

couleur:

couleurProfil

}

profils.push(

nouveauProfil

)

afficherProfils()

modal.style.display =

"none"

}

</script>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,

GoogleAuthProvider,

signInWithPopup,

onAuthStateChanged,

signOut

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,

collection,

addDoc,

getDocs

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:"TON_API_KEY",

authDomain:"xxxx.firebaseapp.com",

projectId:"xxxx",

storageBucket:"xxxx.appspot.com",

messagingSenderId:"xxxx",

appId:"xxxx"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider =

new GoogleAuthProvider();

let user = null;


/* ========================= */

loginBtn.onclick = ()=>{

signInWithPopup(

auth,

provider

)

};

/* ========================= */

onAuthStateChanged(

auth,

(u)=>{

user = u;

if(u){

loginBtn.style.display="none";

profilBtn.style.display="block";

createBtn.style.display="block";

chargerCouleur();

}

else{

loginBtn.style.display="block";

profilBtn.style.display="none";

createBtn.style.display="none";

body.classList.remove(

"custom"

);

}

}

);


/* ========================= */

profilBtn.onclick = ()=>{

signOut(auth)

};

/* ========================= */

createBtn.onclick = ()=>{

if(!user){

alert(

"Connecte-toi d'abord"

);

return;

}

modal.style.display =

"flex";

};

/* ========================= */

saveProfil.onclick = async()=>{

if(!user){

return;

}

const profil = {

nom:

pseudo.value,

photo:

photo.value,

lien:

profilLink.value,

description:

description.value,

categories:

categoriesChoisies,

couleur:

couleurProfil,

uid:

user.uid,

auteur:

user.displayName

};


await addDoc(

collection(

db,

"profils"

),

profil

);


profils.push(profil);

afficherProfils();

modal.style.display =

"none";

};

/* ========================= */

async function chargerProfils(){

const snap =

await getDocs(

collection(

db,

"profils"

)

);


profils = [];


snap.forEach(doc=>{

profils.push(

doc.data()

);

});


afficherProfils();

}


chargerProfils();

</script>


<script>

/* ========================= */

const recherche =

document.getElementById(

"search"

);

recherche.addEventListener(

"input",

()=>{

const texte =

recherche.value

.toLowerCase();

document

.querySelectorAll(

".profil"

)

.forEach(carte=>{

const nom =

carte.innerText

.toLowerCase();

carte.style.display =

nom.includes(texte)

?

"block"

:

"none";

});

});

</script>


<script>

/* ========================= */

document

.querySelectorAll(

".categorie"

)

.forEach(cat=>{

cat.onclick = ()=>{


document

.querySelectorAll(

".categorie"

)

.forEach(c=>{

c.classList.remove(

"active"

);

});

cat.classList.add(

"active"

);


const choix =

cat.innerText;


document

.querySelectorAll(

".profil"

)

.forEach(p=>{


if(

choix==="Tout"

){

p.style.display =

"block";

return;

}


if(

p.innerHTML.includes(

choix

)

){

p.style.display=

"block";

}

else{

p.style.display=

"none";

}

});


};

});

</script>
