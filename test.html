<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon site</title>

<link rel="icon" href="Photo de profil/titre.jpg"><title>Accueil</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#1f1f1f;
    color:white;
}

/* barre du haut */
header{
    height:60px;
    background:#0f0f0f;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    position:sticky;
    top:0;

    border-bottom:1px solid #2a2a2a;
}

/* logo */
.logo img{
    height:40px;
    cursor:pointer;
}

/* barre de recherche */
.search{
    flex:1;
    display:flex;
    justify-content:center;
}

.search input{
    width:500px;

    padding:10px 16px;

    border-radius:25px;

    border:1px solid #333;

    background:#141414;

    color:white;

    font-size:16px;

    outline:none;
}

.search input:focus{
    border-color:#3ea6ff;
}

/* contenu principal */
main{
    padding:20px;
}

.account{
    display:flex;
    align-items:center;
}

#loginBtn{

    background:#3ea6ff;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:20px;

    font-size:15px;

    cursor:pointer;

    transition:0.2s;

}

#loginBtn:hover{
    background:#5bb5ff;
}

.profile{
    position:relative;
}

#avatar{
    width:42px;
    height:42px;

    border-radius:50%;

    cursor:pointer;
}

.menu{

    position:absolute;

    top:55px;

    right:0;

    width:220px;

    background:#242424;

    border-radius:10px;

    padding:10px;

    display:none;

}

</style>

</head>

<body>

<header>

<div class="logo">
    <a href="https://huskymichel.github.io/HuskyMichel-site/"><img src="Photo de profil/Accueil.jpg" class="home-img" alt="Accueil"></a>
</div>

<div class="search">

<input
type="text"
placeholder="🔍 Rechercher un profil..."
>

</div>

<div class="account">

<button id="loginBtn">
Se connecter
</button>

<div class="profile" style="display:none;">

<img id="avatar">

<div class="menu">

<a href="/profil">
Mon profil
</a>

<button id="changePhoto">
Changer la photo
</button>

<button id="logout">
Déconnexion
</button>

</div>

</div>

</div>

</header>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
   apiKey: "AIzaSyA_4v5IjbJBT3R6dyKAtGmsqy-EA_3a73U",
   authDomain: "huskymichel2.firebaseapp.com",
   projectId: "huskymichel2",
   storageBucket: "huskymichel2.firebasestorage.app",
   messagingSenderId: "803041103978",
   appId: "1:803041103978:web:0415d72f91e30735a47a13"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async () => {

    try {

        const result = await signInWithPopup(auth, provider);

        const user = result.user;

        console.log(user.displayName);

        console.log(user.photoURL);

    }

    catch(error){

        console.error(error);

    }

});

</script>

</body>
</html>
