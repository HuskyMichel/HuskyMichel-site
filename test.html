<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon site</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;

    /* 🔵 arrière-plan PLUS CLAIR */
    background:#1f1f1f;

    color:white;
}

/* 🔴 barre du haut PLUS FONCÉE */
header{
    height:60px;
    background:#0f0f0f;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    position:sticky;
    top:0;

    border-bottom:1px solid #2a2a2a;
}

/* logo */
.logo img{
    height:40px;
    cursor:pointer;
}

/* barre de recherche */
.search{
    flex:1;
    display:flex;
    justify-content:center;
}

.search input{
    width:500px;
    padding:10px 16px;

    border-radius:25px;

    border:1px solid #333;

    background:#141414;

    color:white;

    font-size:16px;

    outline:none;
}

.search input:focus{
    border-color:#3ea6ff;
}

/* bouton connexion */
.auth button{
    padding:10px 18px;

    background:#3ea6ff;
    color:white;

    border:none;
    border-radius:20px;

    font-weight:bold;

    cursor:pointer;

    transition:0.2s;
}

.auth button:hover{
    background:#65b8ff;
}

/* zone contenu */
main{
    padding:20px;
}
</style>

</head>

<body>

<header>

<div class="logo">
<img src="logo.png" alt="logo">
</div>

<div class="search">

<input
type="text"
placeholder="Rechercher..."
>

</div>

<div class="auth">

<button id="loginBtn">

Connexion Google

</button>

</div>

</header>

<main>

<h1>Bienvenue</h1>

</main>

<script type="module">

console.log(window.location.hostname);

console.log("Firebase chargé");

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
   apiKey: "AIzaSyA_4v5IjbJBT3R6dyKAtGmsqy-EA_3a73U",
   authDomain: "huskymichel2.firebaseapp.com",
   projectId: "huskymichel2",
   storageBucket: "huskymichel2.firebasestorage.app",
   messagingSenderId: "803041103978",
   appId: "1:803041103978:web:0415d72f91e30735a47a13"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", () => {

    signInWithRedirect(auth, provider);

});

getRedirectResult(auth)
.then((result) => {

    if (result) {

        console.log("Utilisateur connecté");

        console.log(result.user);

    }

})
.catch((error) => {

    console.log(error.code);
    console.log(error.message);

});

loginBtn.addEventListener("click", async () => {

    console.log("clic");

    try {

        await signInWithRedirect(auth, provider);

        console.log("redirection lancée");

    } catch (e) {

        console.error(e);

        alert(e.code);

    }

});
</script>

</body>
</html>
