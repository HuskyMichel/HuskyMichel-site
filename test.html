<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon site</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;

    /* 🔵 arrière-plan PLUS CLAIR */
    background:#1f1f1f;

    color:white;
}

/* 🔴 barre du haut PLUS FONCÉE */
header{
    height:60px;
    background:#0f0f0f;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    position:sticky;
    top:0;

    border-bottom:1px solid #2a2a2a;
}

/* logo */
.logo img{
    height:40px;
    cursor:pointer;
}

/* barre de recherche */
.search{
    flex:1;
    display:flex;
    justify-content:center;
}

.search input{
    width:500px;
    padding:10px 16px;

    border-radius:25px;

    border:1px solid #333;

    background:#141414;

    color:white;

    font-size:16px;

    outline:none;
}

.search input:focus{
    border-color:#3ea6ff;
}

/* bouton connexion */
.auth button{
    padding:10px 18px;

    background:#3ea6ff;
    color:white;

    border:none;
    border-radius:20px;

    font-weight:bold;

    cursor:pointer;

    transition:0.2s;
}

.auth button:hover{
    background:#65b8ff;
}

/* zone contenu */
main{
    padding:20px;
}

.auth{

position:relative;

}

#userMenu{

display:none;

position:relative;

cursor:pointer;

}

#avatar{

width:40px;

height:40px;

border-radius:50%;

object-fit:cover;

border:2px solid #3ea6ff;

}

#menu{

display:none;

position:absolute;

right:0;

top:55px;

background:#181818;

border:1px solid #333;

border-radius:10px;

overflow:hidden;

min-width:220px;

z-index:1000;

}

#menu div{

padding:14px;

cursor:pointer;

}

#menu div:hover{

background:#2a2a2a;

}
</style>

</head>

<body>

<header>

<div class="logo">
<img src="logo.png" alt="logo">
</div>

<div class="search">

<input
type="text"
placeholder="🔍 Rechercher un profil..."
>

</div>

<div class="auth">

<button id="loginBtn">

Connexion Google

</button>

<div id="userMenu" style="display:none;">

<img id="avatar">

<div id="menu">

<div>👤 Mon profil</div>

<div>🖼️ Changer photo de profil</div>

<div id="logoutBtn">

🚪 Déconnexion

</div>

</div>

</div>

</div>

</header>

<main>

<h1>Bienvenue</h1>

</main>

<script type="module">

console.log(window.location.hostname);

console.log("Firebase chargé");

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,

signInWithRedirect,

getRedirectResult,

onAuthStateChanged,

signOut

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
   apiKey: "AIzaSyA_4v5IjbJBT3R6dyKAtGmsqy-EA_3a73U",
   authDomain: "huskymichel2.firebaseapp.com",
   projectId: "huskymichel2",
   storageBucket: "huskymichel2.firebasestorage.app",
   messagingSenderId: "803041103978",
   appId: "1:803041103978:web:0415d72f91e30735a47a13"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const avatar =
document.getElementById("avatar");

const menu =
document.getElementById("menu");

const userMenu =
document.getElementById("userMenu");

const logoutBtn =
document.getElementById("logoutBtn");

onAuthStateChanged(auth,(user)=>{

if(user){

loginBtn.style.display="none";

userMenu.style.display="block";

avatar.src=user.photoURL;

}else{

loginBtn.style.display="block";

userMenu.style.display="none";

}

});

avatar.addEventListener("click",()=>{

menu.style.display=

menu.style.display==="block"

?

"none"

:

"block";

});

logoutBtn.addEventListener("click",()=>{

signOut(auth);

menu.style.display="none";

});

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", () => {

    signInWithRedirect(auth, provider);

});

onAuthStateChanged(auth)
.then((result) => {

    if (result) {

        console.log("Utilisateur connecté");

        console.log(result.user);

    }

})
.catch((error) => {

    console.log(error.code);
    console.log(error.message);

});

loginBtn.addEventListener("click",()=>{

signInWithRedirect(auth,provider);

});
</script>
</body>
</html>
