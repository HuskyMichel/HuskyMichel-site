<head>

<title>HuskyMichel Community</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#202020;

color:white;

transition:0.4s;

}

/* ================= TOPBAR ================= */

.topbar{

position:fixed;

top:0;
left:0;

width:100%;

height:75px;

background:#111;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

z-index:1000;

box-shadow:0 5px 20px rgba(0,0,0,.35);

}

.logo{

height:50px;

cursor:pointer;

}

.recherche{

width:400px;

padding:12px;

border:none;

outline:none;

border-radius:12px;

background:#2f3136;

color:white;

font-size:15px;

}

.recherche::placeholder{

color:#aaa;

}

/* ================= BOUTONS ================= */

.actions{

display:flex;

gap:15px;

align-items:center;

}

.btn{

padding:10px 18px;

border:none;

border-radius:10px;

background:#5865F2;

color:white;

cursor:pointer;

font-size:14px;

transition:.25s;

}

.btn:hover{

transform:translateY(-2px);

background:#4752c4;

}

/* ================= CATEGORIES ================= */

.categories{

margin-top:110px;

display:flex;

gap:12px;

padding:20px;

overflow-x:auto;

}

.categories::-webkit-scrollbar{

display:none;

}

.categorie{

padding:10px 18px;

background:#2f3136;

border-radius:12px;

cursor:pointer;

transition:.3s;

white-space:nowrap;

}

.categorie:hover{

background:#5865F2;

}

.categorie.active{

background:#5865F2;

}

/* ================= PROFILS ================= */

.container{

padding:30px;

display:grid;

grid-template-columns:

repeat(auto-fill,minmax(220px,1fr));

gap:20px;

}

.profil{

background:#2f3136;

border-radius:18px;

padding:15px;

text-align:center;

transition:.3s;

}

.profil:hover{

transform:translateY(-6px);

}

.profil img{

width:90px;

height:90px;

border-radius:50%;

object-fit:cover;

margin-bottom:10px;

}

.nom{

font-size:18px;

font-weight:bold;

margin-bottom:8px;

}

.tag{

display:inline-block;

padding:5px 12px;

border-radius:999px;

background:#40444b;

font-size:12px;

margin-top:6px;

}

.voir{

margin-top:12px;

display:inline-block;

padding:10px 16px;

background:#5865F2;

border-radius:10px;

text-decoration:none;

color:white;

font-size:14px;

}

.voir:hover{

background:#4752c4;

}

/* ================= CREER PROFIL ================= */

.createBtn{

position:fixed;

right:25px;

bottom:25px;

width:65px;

height:65px;

border:none;

border-radius:50%;

font-size:30px;

background:#5865F2;

color:white;

cursor:pointer;

box-shadow:0 8px 25px rgba(0,0,0,.4);

}

.createBtn:hover{

transform:scale(1.05);

}

/* ================= MODAL ================= */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.7);

justify-content:center;

align-items:center;

z-index:3000;

}

.modal-content{

width:500px;

background:#2f3136;

padding:25px;

border-radius:20px;

}

/* ================= MODAL ================= */

.modal-content h2{

margin-bottom:20px;

text-align:center;

}

.input{

width:100%;

padding:12px;

border:none;

border-radius:12px;

margin-bottom:15px;

background:#40444b;

color:white;

font-size:15px;

outline:none;

}

.input::placeholder{

color:#aaa;

}

textarea.input{

resize:none;

height:90px;

}

.categoriesSelect{

display:flex;

flex-wrap:wrap;

gap:10px;

margin-bottom:20px;

}

.catSelect{

padding:10px 14px;

background:#40444b;

border-radius:10px;

cursor:pointer;

transition:.25s;

}

.catSelect:hover{

background:#5865F2;

}

.catSelect.selected{

background:#5865F2;

}

.colorBox{

display:flex;

gap:12px;

margin-top:15px;

margin-bottom:20px;

}

.color{

width:35px;

height:35px;

border-radius:50%;

cursor:pointer;

border:3px solid transparent;

}

.color.active{

border-color:white;

}

.save{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#5865F2;

color:white;

font-size:16px;

cursor:pointer;

}

.save:hover{

background:#4752c4;

}

.close{

position:absolute;

right:20px;

top:15px;

font-size:24px;

cursor:pointer;

}

.hidden{

display:none;

}

</style>

</head>

<script>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA_4v5IjbJBT3R6dyKAtGmsqy-EA_3a73U",
  authDomain: "huskymichel2.firebaseapp.com",
  projectId: "huskymichel2",
  storageBucket: "huskymichel2.firebasestorage.app",
  messagingSenderId: "803041103978",
  appId: "1:803041103978:web:0415d72f91e30735a47a13"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* ================= WAIT DOM ================= */
window.addEventListener("DOMContentLoaded", () => {

  const loginBtn = document.getElementById("loginBtn");
  const profilBtn = document.getElementById("profilBtn");
  const createBtn = document.getElementById("createBtn");
  const modal = document.getElementById("modal");
  const closeModal = document.getElementById("closeModal");
  const saveBtn = document.getElementById("saveProfil");

  let currentUser = null;
  let imageBase64 = "";

  /* ================= LOGIN ================= */
  loginBtn.onclick = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.log(e);
      alert("Erreur connexion");
    }
  };

  profilBtn.onclick = () => {
    signOut(auth);
  };

  /* ================= AUTH STATE ================= */
  onAuthStateChanged(auth, (user) => {
    currentUser = user;

    if (user) {
      loginBtn.style.display = "none";
      profilBtn.style.display = "inline-block";
      createBtn.style.display = "inline-block";
    } else {
      loginBtn.style.display = "inline-block";
      profilBtn.style.display = "none";
      createBtn.style.display = "none";
    }
  });

  /* ================= OPEN MODAL ================= */
  createBtn.onclick = async () => {
    if (!currentUser) {
      alert("Connecte-toi d'abord");
      return;
    }
    modal.style.display = "flex";
  };

  closeModal.onclick = () => {
    modal.style.display = "none";
  };

  /* ================= LIMIT DESCRIPTION 50 ================= */
  const descInput = document.getElementById("description");

  descInput.addEventListener("input", () => {
    if (descInput.value.length > 50) {
      descInput.value = descInput.value.slice(0, 50);
    }
  });

  /* ================= IMAGE FILE ================= */
  const photoInput = document.getElementById("photo");

  photoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      imageBase64 = reader.result;
    };
    reader.readAsDataURL(file);
  });

  /* ================= SAVE PROFILE ================= */
  saveBtn.onclick = async () => {
    if (!currentUser) return;

    const pseudo = document.getElementById("pseudo").value.trim();
    const lien = document.getElementById("profilLink").value;

    if (!pseudo) {
      alert("Pseudo requis");
      return;
    }

    /* CHECK 1 PROFIL MAX */
    const q = query(collection(db, "profils"), where("uid", "==", currentUser.uid));
    const snap = await getDocs(q);

    const data = {
      nom: pseudo,
      photo: imageBase64 || "",
      lien: lien,
      description: descInput.value.slice(0, 50),
      uid: currentUser.uid,
      auteur: currentUser.displayName
    };

    try {

      if (!snap.empty) {
        const id = snap.docs[0].id;
        await updateDoc(doc(db, "profils", id), data);
        alert("Profil modifié !");
      } else {
        await addDoc(collection(db, "profils"), data);
        alert("Profil créé !");
      }

      modal.style.display = "none";

    } catch (e) {
      console.log(e);
      alert("Erreur Firestore");
    }
  };

});
</script>
