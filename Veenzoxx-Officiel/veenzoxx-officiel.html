<script type="module">
import {
  getFirestore,
  doc,
  onSnapshot,
  getDoc,
  setDoc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_4v5IjbJBT3R6dyKAtGmsqy-EA_3a73U",
  authDomain: "huskymichel2.firebaseapp.com",
  projectId: "huskymichel2",
  storageBucket: "huskymichel2.firebasestorage.app",
  messagingSenderId: "803041103978",
  appId: "1:803041103978:web:0415d72f91e30735a47a13"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function listenLikes(profil){
  const ref = doc(db, "likes", profil);

  onSnapshot(ref, (snap) => {
    const data = snap.data();
    const count = data?.count || 0;

    const el = document.getElementById(`count-${profil}`);
    if (el) el.innerText = count;
  });
}

listenLikes("Veenzoxx_Officiel");

window.toggleLike = async (profil) => {
  const user = auth.currentUser;
  if (!user) return alert("Connecte-toi !");

  const likeRef = doc(db, "likes", profil);
  const userRef = doc(db, "userLikes", user.uid);

  const snap = await getDoc(userRef);
  let data = snap.exists() ? snap.data() : {};

  const alreadyLiked = data[profil];

  if (alreadyLiked) {
    await updateDoc(likeRef, {
      count: increment(-1)
    });

    await setDoc(userRef, {
      [profil]: false
    }, { merge: true });

  } else {
    await updateDoc(likeRef, {
      count: increment(1)
    });

    await setDoc(userRef, {
      [profil]: true
    }, { merge: true });
  }
};

listenLikes("Veenzoxx_Officiel");

const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.loginGoogle = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("profile").style.display = "block";

    const custom = localStorage.getItem("customAvatar");

    document.getElementById("avatar").src =
      custom || user.photoURL || "https://ui-avatars.com/api/?name=" + user.displayName;

  } else {
    document.getElementById("loginBtn").style.display = "block";
    document.getElementById("profile").style.display = "none";
  }
});

document.getElementById("profile").onclick = () => {
  const menu = document.getElementById("menuProfil");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};
</script>
<script>
window.changerPhoto = function(){
  document.getElementById("photoInput").click();
};

document.getElementById("photoInput").addEventListener("change", function(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    const image = e.target.result;

    localStorage.setItem("customAvatar", image);

    document.getElementById("avatar").src = image;
  };

  reader.readAsDataURL(file);
});
</script>
