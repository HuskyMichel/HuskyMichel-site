<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer mon profil</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

body{

    font-family:Arial,sans-serif;

    background:
        radial-gradient(
            circle at top,
            #292929 0%,
            #1f1f1f 45%,
            #151515 100%
        );

    color:white;

    min-height:100vh;

}


/* =========================================================
   BARRE DU HAUT
========================================================= */

#barreCompte{

    width:100%;

    height:64px;

    background:rgba(15,15,15,.97);

    border-bottom:1px solid #333;

    display:flex;

    align-items:center;

    justify-content:flex-end;

    padding:0 25px;

    position:sticky;

    top:0;

    z-index:1000;

    box-shadow:
        0 5px 25px rgba(0,0,0,.4);

}


/* =========================================================
   DECONNEXION
========================================================= */

#deconnexion{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    padding:10px 18px;

    background:#292929;

    color:white;

    border:1px solid #444;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:
        .2s ease;

}


#deconnexion:hover{

    background:#3a3a3a;

    border-color:#555;

    transform:translateY(-2px);

    box-shadow:
        0 6px 18px rgba(0,0,0,.4);

}


#deconnexion:active{

    transform:scale(.96);

}


/* =========================================================
   CONTENU
========================================================= */

main{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:45px 30px 80px;

}


/* =========================================================
   TITRE
========================================================= */

h1{

    text-align:center;

    font-size:40px;

    margin-bottom:12px;

    font-weight:bold;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #3ea6ff
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

}


.sousTitre{

    text-align:center;

    color:#999;

    font-size:15px;

    margin-bottom:40px;

}


/* =========================================================
   SECTIONS
========================================================= */

.section{

    background:
        linear-gradient(
            145deg,
            #2b2b2b,
            #242424
        );

    border:1px solid #383838;

    border-radius:18px;

    padding:27px;

    margin-bottom:25px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.2);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

}


.section:hover{

    transform:translateY(-2px);

    border-color:#484848;

    box-shadow:
        0 12px 35px rgba(0,0,0,.3);

}


.section h2{

    margin-bottom:20px;

    font-size:21px;

}


/* =========================================================
   LABEL
========================================================= */

label{

    display:block;

    color:#eee;

    font-size:15px;

    font-weight:bold;

    margin-bottom:8px;

}


/* =========================================================
   INPUTS
========================================================= */

input,
textarea{

    width:100%;

    padding:13px 15px;

    margin-top:8px;

    margin-bottom:16px;

    border-radius:11px;

    border:1px solid #383838;

    outline:none;

    background:#181818;

    color:white;

    font-family:Arial,sans-serif;

    font-size:15px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;

}


input:focus,
textarea:focus{

    background:#151515;

    border-color:#3ea6ff;

    box-shadow:
        0 0 0 3px
        rgba(62,166,255,.12);

}


input::placeholder,
textarea::placeholder{

    color:#777;

}


textarea{

    resize:vertical;

    min-height:130px;

    line-height:1.5;

}


/* =========================================================
   PHOTO
========================================================= */

#photo{

    width:145px;

    height:145px;

    display:block;

    margin:10px auto;

    border-radius:50%;

    object-fit:cover;

    background:#181818;

    border:5px solid #1f1f1f;

    box-shadow:

        0 0 8px white,

        0 0 20px rgba(255,255,255,.7),

        0 0 40px rgba(255,255,255,.2);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

}


#photo:hover{

    transform:scale(1.05);

    box-shadow:

        0 0 10px white,

        0 0 25px rgba(255,255,255,.8),

        0 0 45px rgba(255,255,255,.3);

}


/* =========================================================
   ETAT PSEUDO
========================================================= */

#pseudoEtat{

    min-height:18px;

    margin-bottom:8px;

    color:#999;

    font-size:14px;

}


/* =========================================================
   RESEAUX
========================================================= */

#reseaux{

    display:flex;

    flex-direction:column;

    gap:12px;

    margin-bottom:15px;

}


/* =========================================================
   BOUTONS GENERAUX
========================================================= */

button{

    background:#3ea6ff;

    color:white;

    border:none;

    padding:12px 24px;

    border-radius:11px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:
        background .2s ease,
        transform .2s ease,
        box-shadow .2s ease;

}


button:hover{

    background:#61b8ff;

    transform:translateY(-2px);

    box-shadow:
        0 5px 18px
        rgba(62,166,255,.25);

}


button:active{

    transform:scale(.97);

}


/* =========================================================
   AJOUTER RESEAU
========================================================= */

#ajouterReseau{

    background:#333;

    border:1px solid #484848;

    color:white;

    padding:10px 17px;

}


#ajouterReseau:hover{

    background:#404040;

    border-color:#555;

    box-shadow:none;

}


/* =========================================================
   CATEGORIES
========================================================= */

#categoriesSelectionnees{

    display:flex;

    flex-wrap:wrap;

    gap:9px;

    min-height:25px;

    padding:5px 0 12px;

}


/* =========================================================
   CONTAINER CATEGORIES
========================================================= */

#categoriesContainer{

    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:20px;

}


/* =========================================================
   BOUTONS CATEGORIES
========================================================= */

#categoriesContainer .categorie{

    margin:0;

    padding:9px 15px;

    border-radius:25px;

    border:1px solid #444;

    background:#333;

    color:#ddd;

    font-size:14px;

    font-weight:bold;

    box-shadow:none;

}


#categoriesContainer .categorie:hover{

    background:#3a3a3a;

    border-color:#3ea6ff;

    color:white;

    box-shadow:
        0 0 12px
        rgba(62,166,255,.15);

}


/* =========================================================
   CATEGORIE SELECTIONNEE
========================================================= */

#categoriesContainer
.categorie.selectionnee{

    background:#3ea6ff !important;

    border-color:#3ea6ff !important;

    color:white !important;

    box-shadow:
        0 0 12px
        rgba(62,166,255,.3) !important;

}


/* =========================================================
   SEPARATEUR
========================================================= */

hr{

    border:none;

    border-top:1px solid #444;

}


/* =========================================================
   VIDEO
========================================================= */

#videoYoutube{

    margin-bottom:0;

}


/* =========================================================
   BOUTON SAUVEGARDE
========================================================= */

.save-container{

    display:flex;

    justify-content:center;

    align-items:center;

    margin-top:35px;

}


#saveProfile{

    min-width:240px;

    padding:15px 30px;

    border-radius:14px;

    font-size:17px;

    background:#3ea6ff;

    box-shadow:
        0 5px 20px
        rgba(62,166,255,.18);

}


#saveProfile:hover{

    background:#61b8ff;

    box-shadow:
        0 8px 28px
        rgba(62,166,255,.3);

}


/* =========================================================
   BLOC RESEAU
========================================================= */

.blocReseau{

    display:flex;

    align-items:center;

    gap:10px;

    padding:12px;

    background:#1e1e1e;

    border:1px solid #383838;

    border-radius:12px;

}


.blocReseau input{

    margin:0;

}


.blocReseau button{

    flex-shrink:0;

    padding:10px 14px;

    background:#333;

    border:1px solid #555;

}


.blocReseau button:hover{

    background:#ff1744;

    border-color:#ff1744;

    box-shadow:none;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #barreCompte{

        height:58px;

        padding:0 12px;

    }


    #deconnexion{

        padding:9px 14px;

        font-size:14px;

    }


    main{

        padding:30px 15px 60px;

    }


    h1{

        font-size:31px;

    }


    .section{

        padding:20px;

        border-radius:15px;

    }


    .section h2{

        font-size:19px;

    }


    #photo{

        width:120px;

        height:120px;

    }


    #categoriesContainer{

        gap:7px;

    }


    #categoriesContainer .categorie{

        padding:8px 12px;

        font-size:13px;

    }


    .blocReseau{

        flex-direction:column;

        align-items:stretch;

    }


    .blocReseau input{

        width:100%;

    }


    .blocReseau button{

        width:100%;

    }


    #saveProfile{

        width:100%;

        max-width:350px;

    }

}


/* =========================================================
   PETITS TELEPHONES
========================================================= */

@media(max-width:450px){

    #barreCompte{

        padding:0 10px;

    }


    #deconnexion{

        font-size:13px;

        padding:8px 12px;

    }


    main{

        padding:25px 10px 50px;

    }


    h1{

        font-size:27px;

    }


    .sousTitre{

        font-size:14px;

    }


    .section{

        padding:17px;

    }


    input,
    textarea{

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     BARRE DU COMPTE
======================================================= -->

<div id="barreCompte">

    <button
        id="deconnexion"
        type="button"
    >

        🚪 Déconnexion

    </button>

</div>


<!-- =======================================================
     CONTENU PRINCIPAL
======================================================= -->

<main>


    <h1>

        Créer mon profil

    </h1>


    <p class="sousTitre">

        Personnalise ton profil et présente-toi aux autres.

    </p>


    <!-- =====================================================
         PHOTO
    ====================================================== -->

    <div class="section">

        <h2>

            📸 Photo de profil

        </h2>


        <img
            id="photo"
            alt="Photo de profil"
        >

    </div>


    <!-- =====================================================
         PSEUDO
    ====================================================== -->

    <div class="section">

        <h2>

            👤 Pseudo

        </h2>


        <p id="pseudoEtat"></p>


        <input
            id="pseudo"
            type="text"
            maxlength="30"
            placeholder="Votre pseudo"
            autocomplete="off"
        >

    </div>


    <!-- =====================================================
         PRESENTATION
    ====================================================== -->

    <div class="section">

        <h2>

            ✨ Présentation

        </h2>


        <label for="descriptionCourte">

            Description courte

        </label>


        <input
            id="descriptionCourte"
            maxlength="50"
            placeholder="Une courte phrase pour te présenter..."
        >


        <label for="descriptionLongue">

            Description complète

        </label>


        <textarea
            id="descriptionLongue"
            maxlength="1000"
            rows="8"
            placeholder="Présente-toi, parle de tes passions, de ton contenu..."
        ></textarea>

    </div>


    <!-- =====================================================
         RESEAUX
    ====================================================== -->

    <div class="section">

        <h2>

            🌐 Réseaux sociaux

        </h2>


        <div id="reseaux"></div>


        <button
            type="button"
            id="ajouterReseau"
        >

            ＋ Ajouter un réseau

        </button>

    </div>


    <!-- =====================================================
         VIDEO
    ====================================================== -->

    <div class="section">

        <h2>

            🎬 Vidéo mise en avant

        </h2>


        <label for="videoYoutube">

            Lien de ta vidéo YouTube

        </label>


        <input
            type="url"
            id="videoYoutube"
            placeholder="https://www.youtube.com/watch?v=..."
        >

    </div>


    <!-- =====================================================
         CATEGORIES
    ====================================================== -->

    <div class="section">

        <h2>

            🏷️ Catégories

        </h2>


        <h3 style="
            font-size:16px;
            margin-bottom:12px;
            color:#ddd;
        ">

            Catégories sélectionnées

        </h3>


        <div
            id="categoriesSelectionnees"
        ></div>


        <hr
            style="
                margin:20px 0;
            "
        >


        <h3 style="
            font-size:16px;
            margin-bottom:8px;
            color:#aaa;
        ">

            Choisir tes catégories

        </h3>


        <div id="categoriesContainer">

            Chargement...

        </div>

    </div>


    <!-- =====================================================
         ENREGISTREMENT
    ====================================================== -->

    <div class="save-container">

        <button
            id="saveProfile"
            type="button"
        >

            💾 Créer mon profil

        </button>

    </div>


</main>


<!-- =======================================================
     JAVASCRIPT
======================================================= -->

<script
    type="module"
    src="creer-profil.js"
></script>


</body>

</html>
