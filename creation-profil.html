<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer mon profil</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#1f1f1f;
    color:white;
}

main{
    max-width:900px;
    margin:auto;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.section{

    background:#2a2a2a;

    padding:25px;

    border-radius:15px;

    margin-bottom:25px;

}

.section h2{

    margin-top:0;

}

input,textarea{

    width:100%;

    box-sizing:border-box;

    margin-top:10px;

    margin-bottom:15px;

    padding:12px;

    border-radius:10px;

    border:none;

    background:#181818;

    color:white;

}

textarea{

    resize:vertical;

}

button{

    background:#3ea6ff;

    color:white;

    border:none;

    padding:12px 25px;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;

}

button:hover{

    background:#5bb5ff;

}

#photo{

    width:120px;

    height:120px;

    border-radius:50%;

    display:block;

    margin:auto;

    object-fit:cover;

    border:4px solid white;

}

#categoriesContainer{

    margin-top:20px;

}

</style>

</head>

<body>

<main>

<h1>Créer mon profil</h1>

<div class="section">

<h2>Photo de profil</h2>

<img id="photo">

</div>

<div class="section">

<p id="pseudoEtat"></p>

<h2>Pseudo</h2>

<input
id="pseudo"
type="text"
placeholder="Votre pseudo">

<p id="pseudoEtat"></p>

</div>

<div class="section">

<h2>Description courte</h2>

<input
id="descriptionCourte"
maxlength="50"
placeholder="50 caractères maximum">

<h2>Description complète</h2>

<textarea
id="descriptionLongue"
maxlength="1000"
rows="8"
placeholder="Présente-toi..."></textarea>

</div>

<div class="section">

<h2>Réseaux sociaux</h2>

<div id="reseaux"></div>

<button
type="button"
id="ajouterReseau">

+ Ajouter un réseau

</button>

</div>

<div class="section">

<label>🎬 Vidéo mise en avant (YouTube)</label>

<input
    type="url"
    id="videoYoutube"
    placeholder="https://www.youtube.com/watch?v=..."
>

</div>

<div class="section">



<h2>Catégories</h2>

<h3>Catégories sélectionnées</h3>

<div id="categoriesSelectionnees"></div>

<hr style="margin:20px 0;border:1px solid #444;">

<div id="categoriesContainer">

Chargement...

</div>

</div>

<center>

<button id="saveProfile">

Créer mon profil

</button>

</center>

</main>

<script type="module" src="creer-profil.js"></script>

</body>
</html>
