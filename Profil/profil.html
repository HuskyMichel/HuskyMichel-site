<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="icon" href="../Photo de profil/titre.jpg">

<title>Mon Profil</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f5f5f5,#e8e8e8);
min-height:100vh;
}

/* =======================
TOPBAR
======================= */

.topbar{

display:flex;
align-items:center;
justify-content:space-between;

padding:15px 25px;

background:white;

box-shadow:0 4px 12px rgba(0,0,0,.08);

position:sticky;
top:0;
z-index:1000;
}

.home-img{
width:140px;
transition:.3s;
cursor:pointer;
}

.home-img:hover{
transform:scale(1.08);
}

/* =======================
RECHERCHE
======================= */

.recherche-container{

position:relative;

width:400px;
max-width:45%;
}

#recherche{

width:100%;

padding:12px 15px;

border:none;

border-radius:12px;

font-size:16px;

box-shadow:0 5px 15px rgba(0,0,0,.12);

outline:none;
}

#resultats{

position:absolute;

top:50px;
left:0;

width:100%;

background:white;

border-radius:12px;

overflow:hidden;

box-shadow:0 8px 25px rgba(0,0,0,.12);

z-index:999;
}

.resultat{

display:flex;
align-items:center;
justify-content:space-between;

padding:12px;

cursor:pointer;

transition:.2s;
}

.resultat:hover{
background:#f5f5f5;
}

.resultat-photo{

width:40px;
height:40px;

border-radius:50%;

object-fit:cover;

transition:.3s;
}

.resultat:hover .resultat-photo{

transform:scale(1.1);

box-shadow:0 5px 15px rgba(0,0,0,.18);
}

/* =======================
MENU UTILISATEUR
======================= */

#userBox{
position:relative;
}

#loginBtn{

padding:10px 16px;

border:none;

border-radius:12px;

background:black;

color:white;

cursor:pointer;

font-weight:600;

transition:.2s;
}

#loginBtn:hover{
transform:scale(1.05);
}

#profile{
display:none;
}

#avatar{

width:45px;
height:45px;

border-radius:50%;

cursor:pointer;

object-fit:cover;

transition:.3s;
}

#avatar:hover{

transform:scale(1.08);

box-shadow:0 6px 20px rgba(0,0,0,.18);
}

#menuProfil{

display:none;

position:absolute;

top:60px;
right:0;

width:220px;

background:white;

border-radius:15px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.15);

animation:menuPop .15s ease-out;
}

@keyframes menuPop{

from{
opacity:0;
transform:translateY(-10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

#menuProfil p{

padding:14px;

cursor:pointer;

transition:.2s;
}

#menuProfil p:hover{
background:#f3f3f3;
}

#menuProfil::before{

content:"";

position:absolute;

top:-6px;
right:15px;

width:12px;
height:12px;

background:white;

transform:rotate(45deg);
}

/* =======================
HEADER PROFIL
======================= */

.header-profil{

width:100%;

display:flex;
justify-content:center;

padding:40px 20px;
}

.carte-profil{

background:white;

width:95%;
max-width:1000px;

border-radius:25px;

padding:30px;

box-shadow:0 8px 25px rgba(0,0,0,.12);

text-align:center;
}

.photo-profil{

width:180px;
height:180px;

border-radius:50%;

object-fit:cover;

border:6px solid white;

box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.nom-profil{

margin-top:20px;

font-size:35px;

font-weight:bold;
}

.email-profil{

margin-top:10px;

color:#666;
}

/* =======================
STATISTIQUES
======================= */

.stats{

display:flex;

justify-content:center;

gap:30px;

margin-top:25px;

flex-wrap:wrap;
}

.stat{

background:#f8f8f8;

padding:15px 25px;

border-radius:15px;

min-width:140px;
}

.stat h2{

font-size:24px;

margin-bottom:5px;
}

.stat p{
color:#666;
}

/* =======================
SECTION FAVORIS
======================= */

.section{

padding:30px;
}

.section-title{

text-align:center;

font-size:30px;

margin-bottom:30px;
}

#favorisContainer{

display:flex;

justify-content:center;

flex-wrap:wrap;

gap:25px;
}

/* =======================
CARTE FAVORI
======================= */

.favori-card{

width:260px;

background:white;

border-radius:20px;

padding:20px;

text-align:center;

box-shadow:0 8px 20px rgba(0,0,0,.12);

transition:.3s;
}

.favori-card:hover{

transform:translateY(-8px);
}

.favori-card img{

width:100%;

height:180px;

object-fit:cover;

border-radius:15px;
}

.favori-card h3{

margin-top:15px;
}

.favori-card a{

display:inline-block;

margin-top:15px;

padding:12px 20px;

background:black;

color:white;

text-decoration:none;

border-radius:10px;
}

/* =======================
DONS
======================= */

.don-widget{

position:fixed;

right:20px;
bottom:20px;

z-index:999;
}

.don-toggle{

width:60px;
height:60px;

border:none;

border-radius:50%;

background:black;

color:white;

font-size:24px;

cursor:pointer;
}

.don-content{

display:none;

margin-bottom:10px;

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 8px 25px rgba(0,0,0,.18);

text-align:center;
}

/* =======================
RESPONSIVE
======================= */

@media(max-width:900px){

.topbar{
flex-wrap:wrap;
gap:15px;
}

.recherche-container{
max-width:100%;
width:100%;
}

.nom-profil{
font-size:28px;
}

.stats{
gap:15px;
}

}

</style>
</head>

<body>

<div class="topbar">

<a href="https://huskymichel.github.io/HuskyMichel-site/">
<img src="../Photo de profil/Accueil.jpg"
class="home-img">
</a>

<div class="recherche-container">

<input
type="text"
id="recherche"
placeholder="🔍 Rechercher un profil..."
onkeyup="chercherProfil()">

<div id="resultats"></div>

</div>

<div id="userBox">

<button id="loginBtn"
onclick="loginGoogle()">
Se connecter
</button>

<div id="profile">

<img id="avatar">

</div>

<div id="menuProfil">

<p onclick="window.location.href='profil.html'">
👤 Mon profil
</p>

<p onclick="changerPhoto()">
🖼️ Changer photo
</p>

<p onclick="logout()">
🚪 Déconnexion
</p>

</div>

</div>

</div>

<input
type="file"
id="photoInput"
accept="image/*"
style="display:none;">

<div class="header-profil">

<div class="carte-profil">

<img
id="photoProfil"
class="photo-profil"
src="../Photo de profil/Photo de profil HuskyMichel.jpg">

<h1
id="nomProfil"
class="nom-profil">
Chargement...
</h1>

<p
id="emailProfil"
class="email-profil">
Connexion requise
</p>

<div class="stats">

<div class="stat">
<h2 id="nbFavoris">0</h2>
<p>Favoris</p>
</div>

</div>

</div>

</div>

<div class="section">

<h2 class="section-title">
❤️ Mes créateurs favoris
</h2>

<div id="favorisContainer">

</div>

</div>

<!-- =========================
DONS FLOTTANTS
========================= -->

<div class="don-widget">

<button
class="don-toggle"
onclick="toggleDon()">
💰
</button>

<div
id="donContent"
class="don-content">

<h3>
💰 Dons
</h3>

<p>
En cours...
</p>

<p style="margin-top:10px;color:#666;">
Merci pour le soutien ❤️
</p>

</div>

</div>

<script>

function toggleDon(){

const box =
document.getElementById("donContent");

if(box.style.display==="block"){

box.style.display="none";

}else{

box.style.display="block";

}

}

</script>

<script>

const profils = [

{
nom:"HuskyMichel",
lien:"../HuskyMichel/huskymichel.html",
photo:"../Photo de profil/Photo de profil HuskyMichel.jpg"
},

{
nom:"Gerrix",
lien:"../Gerrix/gerrix.html",
photo:"../Photo de profil/Photo de profil Gerrix.jpg"
},

{
nom:"XSU LIFEZEN",
lien:"../XSU-LIFEZEN/xsu-lifezen.html",
photo:"../Photo de profil/Photo de profil XSU LIFEZEN.jpg"
},

{
nom:"Veenzoxx Officiel",
lien:"../Veenzoxx-Officiel/veenzoxx-officiel.html",
photo:"../Photo de profil/Photo de profil Veenzoxx Officiel.jpg"
}

];

function chercherProfil(){

const recherche =
document
.getElementById("recherche")
.value
.toLowerCase();

const resultats =
document.getElementById("resultats");

resultats.innerHTML="";

if(recherche.length===0){
return;
}

profils.forEach(profil=>{

if(
profil.nom
.toLowerCase()
.includes(recherche)
){

const div =
document.createElement("div");

div.className="resultat";

div.innerHTML=`

<span>${profil.nom}</span>

<img
src="${profil.photo}"
class="resultat-photo">

`;

div.onclick=()=>{

window.location.href=
profil.lien;

};

resultats.appendChild(div);

}

});

}

</script>

<script type="module">

const profils = [
  { nom:"Gerrix", photo:"...", lien:"..." },
  { nom:"Veenzoxx Officiel", photo:"...", lien:"..." }
];

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function chargerFavoris(uid){

  const ref = doc(db, "userFavorites", uid);
  const snap = await getDoc(ref);

  const container = document.getElementById("favorisContainer");
  const compteur = document.getElementById("nbFavoris");

  container.innerHTML = "";

  if(!snap.exists()){
    compteur.innerText = "0";
    return;
  }

  const data = snap.data();

  let count = 0;

  Object.keys(data).forEach((nom) => {

    if(data[nom] === true){

      count++;

      const profil = profils.find(p => p.nom === nom);

      if(profil){

        const card = document.createElement("div");
        card.className = "favori-card";

        card.innerHTML = `
          <img src="${profil.photo}">
          <h3>${profil.nom}</h3>
          <a href="${profil.lien}">Voir le profil</a>
        `;

        container.appendChild(card);
      }
    }
  });

  compteur.innerText = count;
}

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ======================
CONFIG FIREBASE
====================== */

const firebaseConfig = {
  apiKey: "AIzaSyA_4v5IjbJBT3R6dyKAtGmsqy-EA_3a73U",
  authDomain: "huskymichel2.firebaseapp.com",
  projectId: "huskymichel2",
  storageBucket: "huskymichel2.firebasestorage.app",
  messagingSenderId: "803041103978",
  appId: "1:803041103978:web:0415d72f91e30735a47a13"
};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const provider =
new GoogleAuthProvider();

/* ======================
CONNEXION
====================== */

window.loginGoogle = async () => {

try{

await signInWithPopup(
auth,
provider
);

}catch(error){

console.error(error);

alert(
"Erreur de connexion"
);

}

};

/* ======================
DECONNEXION
====================== */

window.logout = async () => {

await signOut(auth);

window.location.reload();

};

/* ======================
ETAT UTILISATEUR
====================== */

onAuthStateChanged(
auth,
async(user)=>{

if(user){

document
.getElementById("loginBtn")
.style.display="none";

document
.getElementById("profile")
.style.display="block";

/* PHOTO */

const customAvatar =
localStorage.getItem(
"customAvatar"
);

document
.getElementById("avatar")
.src =
customAvatar ||
user.photoURL;

/* PROFIL */

document
.getElementById("photoProfil")
.src =
customAvatar ||
user.photoURL;

document
.getElementById("nomProfil")
.innerText =
user.displayName;

document
.getElementById("emailProfil")
.innerText =
user.email;

/* MENU */

document
.getElementById("profile")
.onclick=()=>{

const menu=
document.getElementById(
"menuProfil"
);

menu.style.display=
menu.style.display==="block"
?
"none"
:
"block";

};

/* FAVORIS */

chargerFavoris(user.uid);

}else{

document
.getElementById("loginBtn")
.style.display="block";

document
.getElementById("profile")
.style.display="none";

document
.getElementById("nomProfil")
.innerText=
"Non connecté";

document
.getElementById("emailProfil")
.innerText=
"Connecte-toi";

}

});

/* ======================
CHANGER PHOTO
====================== */

window.changerPhoto=
function(){

document
.getElementById(
"photoInput"
)
.click();

};

document
.getElementById(
"photoInput"
)
.addEventListener(
"change",
function(event){

const file=
event.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=
function(e){

const image=
e.target.result;

localStorage.setItem(
"customAvatar",
image
);

document
.getElementById("avatar")
.src=image;

document
.getElementById("photoProfil")
.src=image;

};

reader.readAsDataURL(
file
);

}
);

/* ======================
OUVRIR PROFIL
====================== */

window.ouvrirProfil=
function(){

window.location.href=
"profil.html";

};

</script>

<script>
window.changerPhoto = function(){
  document.getElementById("photoInput").click();
};

const photoInput = document.getElementById("photoInput");

if(photoInput){
  photoInput.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){
      const image = e.target.result;

      localStorage.setItem("customAvatar", image);

      const avatar = document.getElementById("avatar");

      if(avatar){
        avatar.src = image;
      }
    };

    reader.readAsDataURL(file);
  });
}
</script>

<script>
function toggleDon(){

  const box = document.getElementById("donContent");

  if(!box) return;

  if(box.style.display === "none"){
    box.style.display = "block";
  }else{
    box.style.display = "none";
  }
}
</script>

<script>
document.addEventListener("click", function(event){

  const menu = document.getElementById("menuProfil");
  const userBox = document.getElementById("userBox");

  if(!menu || !userBox) return;

  if(!userBox.contains(event.target)){
    menu.style.display = "none";
  }

});
</script>

<script>
window.ouvrirProfil = function(){

  window.location.href =
  "/HuskyMichel-site/Profil/profil.html";

};
</script>

<script>
window.voirFavoris = function(){

  const section =
  document.getElementById("listeFavoris");

  if(section){
    section.scrollIntoView({
      behavior:"smooth"
    });
  }

};
</script>

<script>
function afficherProfilLike(nom, photo, lien){

  const liste =
  document.getElementById("listeFavoris");

  if(!liste) return;

  const carte =
  document.createElement("div");

  carte.className = "favori-card";

  carte.innerHTML = `
    <img src="${photo}">
    <h3>${nom}</h3>
    <a href="${lien}">
      Voir le profil
    </a>
  `;

  liste.appendChild(carte);

}
</script>

<script>
window.addEventListener("load", () => {

  const avatar =
  document.getElementById("avatar");

  const custom =
  localStorage.getItem("customAvatar");

  if(custom && avatar){
    avatar.src = custom;
  }

});
</script>

</body>
</html>
