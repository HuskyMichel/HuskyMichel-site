<script type="module">

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db = getFirestore();

/* ================= PROFILS ================= */
const profils = [
  {
    nom: "HuskyMichel",
    lien: "/HuskyMichel-site/HuskyMichel/huskymichel.html",
    photo: "Barre de recherche/Photo de profil HuskyMichel.jpg"
  },
  {
    nom: "Veenzoxx Officiel",
    lien: "/HuskyMichel-site/Veenzoxx-Officiel/veenzoxx-officiel.html",
    photo: "Barre de recherche/Photo de profil Veenzoxx Officiel.jpg"
  },
  {
    nom: "Gerrix",
    lien: "/HuskyMichel-site/Gerrix/gerrix.html",
    photo: "Barre de recherche/Photo de profil Gerrix.jpg"
  },
  {
  nom: "XSU LIFEZEN",
  lien: "/HuskyMichel-site/XSU-LIFEZEN/xsu-lifezen.html",
  photo: "Barre de recherche/Photo de profil XSU LIFEZEN.jpg"
}
];

/* ================= FAVORIS ================= */
async function chargerFavoris(uid){

  const ref = doc(db, "userFavorites", uid);
  const snap = await getDoc(ref);

  const container = document.getElementById("favContainer");
  container.innerHTML = "";

  if(!snap.exists()) return;

  const data = snap.data();

  for(const nom in data){

    if(data[nom] === true){

      const profil = profils.find(p => p.nom === nom);

      if(profil){

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${profil.photo}">
          <h3>${profil.nom}</h3>
          <a href="${profil.lien}">Voir le profil</a>
        `;

        container.appendChild(card);
      }
    }
  }
}

/* ================= RECHERCHE ================= */
window.search = function(){

  const val = document.getElementById("recherche").value.toLowerCase();
  const box = document.getElementById("resultats");

  box.innerHTML = "";

  if(val.length === 0) return;

  profils.forEach(p => {

    if(p.nom.toLowerCase().includes(val)){

      const div = document.createElement("div");
      div.className = "resultat";

      div.innerHTML = `<span>${p.nom}</span>`;

      div.onclick = () => {
        window.location.href = p.lien;
      };

      box.appendChild(div);
    }
  });
};

</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX",
  storageBucket: "XXX",
  messagingSenderId: "XXX",
  appId: "XXX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* ================= LOGIN ================= */
window.loginGoogle = function(){
  signInWithPopup(auth, provider);
};

/* ================= LOGOUT ================= */
window.logout = function(){
  signOut(auth);
};

/* ================= PROFILS (pour favoris) ================= */
const profils = [
  { nom:"Gerrix", lien:"../Gerrix/gerrix.html", photo:"../Photo de profil/Gerrix.jpg" },
  { nom:"Lifezen", lien:"../Lifezen/lifezen.html", photo:"../Photo de profil/Lifezen.jpg" },
  { nom:"Veenzoxx", lien:"../Veenzoxx/veenzoxx.html", photo:"../Photo de profil/Veenzoxx.jpg" }
];

/* ================= AUTH STATE ================= */
onAuthStateChanged(auth, async (user) => {

  if(user){

    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("avatar").style.display = "block";

    document.getElementById("avatar").src = user.photoURL;
    document.getElementById("photoProfil").src = user.photoURL;
    document.getElementById("nom").innerText = user.displayName;
    document.getElementById("email").innerText = user.email;

    chargerFavoris(user.uid);

  } else {

    document.getElementById("loginBtn").style.display = "block";
    document.getElementById("avatar").style.display = "none";

    document.getElementById("nom").innerText = "Invité";
    document.getElementById("email").innerText = "Non connecté";
  }

});

</script>
