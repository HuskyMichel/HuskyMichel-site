<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="Photo de profil/titre.jpg"><title>Mon profil</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f5f5f5,#ebebeb);
}

/* TOPBAR */

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 25px;
background:white;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.home-img{
width:140px;
transition:0.3s;
}

.home-img:hover{
transform:scale(1.08);
}

/* PROFIL */

.profil-container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.profil-header{
text-align:center;
margin-bottom:50px;
}

.profil-photo{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.profil-nom{
margin-top:20px;
font-size:32px;
font-weight:bold;
}

.profil-email{
color:#666;
margin-top:10px;
}

/* SECTION */

.section{
margin-top:50px;
}

.section h2{
text-align:center;
margin-bottom:30px;
}

/* LIKES */

#likesContainer{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
}

.carte{
width:250px;
background:white;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.carte img{
width:100%;
border-radius:15px;
}

.bouton{
display:inline-block;
margin-top:15px;
padding:10px 20px;
background:black;
color:white;
text-decoration:none;
border-radius:10px;
}

/* FUTUR */

.placeholder{
background:white;
padding:20px;
border-radius:15px;
margin-top:20px;
text-align:center;
box-shadow:0 6px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

  <a href="index.html">
    <img src="Photo de profil/Accueil.jpg" class="home-img">
  </a>

</div>

<!-- PROFIL -->

<div class="profil-container">

  <div class="profil-header">

    <img id="profilPhoto" class="profil-photo">

    <div id="profilNom" class="profil-nom">
      Chargement...
    </div>

    <div id="profilEmail" class="profil-email">
      Chargement...
    </div>

  </div>

  <!-- PROFILS LIKÉS -->

  <div class="section">

    <h2>❤️ Profils likés</h2>

    <div id="likesContainer"></div>

  </div>

  <!-- FUTURES CATÉGORIES -->

  <div class="section">

    <h2>⭐ Catégories futures</h2>

    <div class="placeholder">
      Cette zone servira plus tard pour les favoris, badges, collections et autres fonctionnalités.
    </div>

  </div>

</div>

</body>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyA_4v5IjbJBT3R6dyKAtGmsqy-EA_3a73U",
  authDomain: "huskymichel2.firebaseapp.com",
  projectId: "huskymichel2",
  storageBucket: "huskymichel2.firebasestorage.app",
  messagingSenderId: "803041103978",
  appId: "1:803041103978:web:0415d72f91e30735a47a13"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const profils = {

  Gerrix: {
    nom: "Gerrix",
    photo: "Photo de profil/Photo de profil Gerrix.jpg",
    lien: "Gerrix/gerrix.html"
  },

  XSU_LIFEZEN: {
    nom: "XSU LIFEZEN",
    photo: "Photo de profil/Photo de profil XSU LIFEZEN.jpg",
    lien: "XSU-LIFEZEN/xsu-lifezen.html"
  },

  Veenzoxx_Officiel: {
    nom: "Veenzoxx Officiel",
    photo: "Photo de profil/Photo de profil Veenzoxx Officiel.jpg",
    lien: "Veenzoxx-Officiel/veenzoxx-officiel.html"
  },

  HuskyMichel: {
    nom: "HuskyMichel",
    photo: "Photo de profil/Photo de profil HuskyMichel.jpg",
    lien: "HuskyMichel/huskymichel.html"
  }

};

/* ================= UTILISATEUR CONNECTÉ ================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    alert("Tu dois être connecté.");
    window.location.href = "index.html";

    return;
  }

  /* PHOTO */

  document.getElementById("profilPhoto").src =
    localStorage.getItem("customAvatar")
    || user.photoURL;

  /* NOM */

  document.getElementById("profilNom").innerText =
    user.displayName;

  /* EMAIL */

  document.getElementById("profilEmail").innerText =
    user.email;

  /* CHARGEMENT DES LIKES */

  chargerLikes(user.uid);

});

async function chargerLikes(uid){

  const container =
    document.getElementById("likesContainer");

  container.innerHTML = "";

  const ref = doc(db, "userLikes", uid);

  const snap = await getDoc(ref);

  if(!snap.exists()){

    container.innerHTML = `
      <div class="placeholder">
        Aucun profil liké pour le moment ❤️
      </div>
    `;

    return;
  }

  const data = snap.data();

  let nombreLikes = 0;

  for(const profilId in data){

    if(data[profilId] !== true) continue;

    nombreLikes++;

    const profil = profils[profilId];

    if(!profil) continue;

    const carte = document.createElement("div");

    carte.className = "carte";

    carte.innerHTML = `
      <img src="${profil.photo}">
      <h3>${profil.nom}</h3>

      <a href="${profil.lien}"
         class="bouton">
         Voir le profil
      </a>
    `;

    container.appendChild(carte);
  }

  if(nombreLikes === 0){

    container.innerHTML = `
      <div class="placeholder">
        Aucun profil liké pour le moment ❤️
      </div>
    `;
  }
}

</script>
</body>
</html>
