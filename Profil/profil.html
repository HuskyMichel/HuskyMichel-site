<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="Photo de profil/titre.jpg"><title>Mon profil</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f5f5f5,#ebebeb);
}

/* ================= TOPBAR ================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 25px;
  background:white;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.home-img{
  width:140px;
  transition:0.3s;
}

.home-img:hover{
  transform:scale(1.08);
}

/* ================= RECHERCHE ================= */

.recherche-container{
  position:relative;
  width:350px;
}

#recherche{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-size:16px;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  outline:none;
}

#resultats{
  position:absolute;
  width:100%;
  background:white;
  border-radius:12px;
  margin-top:5px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  z-index:1000;
}

.resultat{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  cursor:pointer;
}

.resultat:hover{
  background:#f0f0f0;
}

.resultat-photo{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  transition:0.3s;
}

.resultat:hover .resultat-photo{
  transform:scale(1.15);
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}

/* ================= AVATAR ================= */

#avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  cursor:pointer;
  transition:0.2s;
}

#avatar:hover{
  transform:scale(1.08);
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

/* ================= MENU PROFIL ================= */

#userBox{
  position:relative;
}

#menuProfil{
  display:none;
  position:absolute;
  right:0;
  top:55px;
  background:white;
  border-radius:14px;
  padding:8px 0;
  width:200px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
  overflow:hidden;
  z-index:1000;
}

#menuProfil p{
  margin:0;
  padding:12px 15px;
  cursor:pointer;
  transition:0.2s;
}

#menuProfil p:hover{
  background:#f2f2f2;
}

#menuProfil a{
  color:black;
  text-decoration:none;
}

#menuProfil::before{
  content:"";
  position:absolute;
  top:-6px;
  right:15px;
  width:12px;
  height:12px;
  background:white;
  transform:rotate(45deg);
}

/* PROFIL */

.profil-container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.profil-header{
text-align:center;
margin-bottom:50px;
}

.profil-photo{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.profil-nom{
margin-top:20px;
font-size:32px;
font-weight:bold;
}

.profil-email{
color:#666;
margin-top:10px;
}

/* SECTION */

.section{
margin-top:50px;
}

.section h2{
text-align:center;
margin-bottom:30px;
}

/* LIKES */

#likesContainer{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
}

.carte{
width:250px;
background:white;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.carte img{
width:100%;
border-radius:15px;
}

.bouton{
display:inline-block;
margin-top:15px;
padding:10px 20px;
background:black;
color:white;
text-decoration:none;
border-radius:10px;
}

/* FUTUR */

.placeholder{
background:white;
padding:20px;
border-radius:15px;
margin-top:20px;
text-align:center;
box-shadow:0 6px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

			<a href="https://huskymichel.github.io/HuskyMichel-site/"><img src="Photo de profil/Accueil.jpg" class="home-img" alt="Accueil"></a>

			<div class="recherche-container">

				<input
				type="text"
				id="recherche"
				placeholder="🔍 Rechercher un profil..."
				onkeyup="chercherProfil()">

				<div id="resultats"></div>

			</div>

<div id="userBox">
  <button id="loginBtn" onclick="loginGoogle()" style="
  padding:10px 16px;
  border:none;
  border-radius:12px;
  background:black;
  color:white;
  cursor:pointer;
  font-weight:500;
">
Se connecter
</button>

  <div id="profile" style="display:none;">
    <img id="avatar" style="width:40px;height:40px;border-radius:50%;">
  </div>

  <div id="menuProfil">
  <a href="https://huskymichel.github.io/HuskyMichel-site/Profil/profil.html"> <p onclick="voirFavoris()">👤 Mon profil</p></a>
  <p onclick="changerPhoto()">🖼️ Changer photo de profil</p>
  <p onclick="logout()">🚪 Déconnexion</p>
</div>
</div>

		</div>

			<input type="file" id="photoInput" accept="image/*" style="display:none;">


<!-- PROFIL -->

<div class="profil-container">

  <div class="profil-header">

    <img id="profilPhoto" class="profil-photo">

    <div id="profilNom" class="profil-nom">
      Chargement...
    </div>

    <div id="profilEmail" class="profil-email">
      Chargement...
    </div>

  </div>

  <!-- PROFILS LIKÉS -->

  <div class="section">

    <h2>❤️ Profils likés</h2>

    <div id="likesContainer"></div>

  </div>

  <!-- FUTURES CATÉGORIES -->

  <div class="section">

    <h2>⭐ Catégories futures</h2>

    <div class="placeholder">
      Cette zone servira plus tard pour les favoris, badges, collections et autres fonctionnalités.
    </div>

  </div>

</div>

</body>

<script>

const profils = [
  {
    nom: "HuskyMichel",
    lien: "HuskyMichel/huskymichel.html",
    photo: "HuskyMichel/Barre de recherche/Photo de profil HuskyMichel.jpg"
  },
  {
    nom: "Veenzoxx Officiel",
    lien: "Veenzoxx-Officiel/veenzoxx-officiel.html",
    photo: "Veenzoxx-Officiel/Barre de recherche/Photo de profil Veenzoxx Officiel.jpg"
  },
  {
    nom: "Gerrix",
    lien: "Gerrix/gerrix.html",
    photo: "Gerrix/Barre de recherche/Photo de profil Gerrix.jpg"
  },
  {
  nom: "XSU LIFEZEN",
  lien: "XSU-LIFEZEN/xsu-lifezen.html",
  photo: "XSU-LIFEZEN/Barre de recherche/Photo de profil XSU LIFEZEN.jpg"
}
];

			function chercherProfil(){

			const recherche =
			document.getElementById("recherche").value.toLowerCase();

			const resultats =
			document.getElementById("resultats");

			resultats.innerHTML = "";

			if(recherche.length === 0){
			return;
			}

			profils.forEach(profil => {

			if(profil.nom.toLowerCase().includes(recherche)){

			const div = document.createElement("div");

div.className = "resultat";

div.innerHTML = `
  <span>${profil.nom}</span>
  <img src="${profil.photo}" class="resultat-photo">
`;

div.onclick = () => {
  window.voirFavoris = function(){
  window.location.href = "profil/profil.html";
}

resultats.appendChild(div);
			}

			});

			}

		</script>
		
<script type="module">
document.getElementById("profile").onclick = () => {

  const menu = document.getElementById("menuProfil");

  if(menu.style.display === "block"){
    menu.style.display = "none";
  }else{
    menu.style.display = "block";
  }

};

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyA_4v5IjbJBT3R6dyKAtGmsqy-EA_3a73U",
  authDomain: "huskymichel2.firebaseapp.com",
  projectId: "huskymichel2",
  storageBucket: "huskymichel2.firebasestorage.app",
  messagingSenderId: "803041103978",
  appId: "1:803041103978:web:0415d72f91e30735a47a13"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const profils = {

  Gerrix: {
    nom: "Gerrix",
    photo: "Photo de profil/Photo de profil Gerrix.jpg",
    lien: "Gerrix/gerrix.html"
  },

  XSU_LIFEZEN: {
    nom: "XSU LIFEZEN",
    photo: "Photo de profil/Photo de profil XSU LIFEZEN.jpg",
    lien: "XSU-LIFEZEN/xsu-lifezen.html"
  },

  Veenzoxx_Officiel: {
    nom: "Veenzoxx Officiel",
    photo: "Photo de profil/Photo de profil Veenzoxx Officiel.jpg",
    lien: "Veenzoxx-Officiel/veenzoxx-officiel.html"
  },

  HuskyMichel: {
    nom: "HuskyMichel",
    photo: "Photo de profil/Photo de profil HuskyMichel.jpg",
    lien: "HuskyMichel/huskymichel.html"
  }

};

/* ================= UTILISATEUR CONNECTÉ ================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    alert("Tu dois être connecté.");
    window.location.href = "index.html";

    return;
  }

  /* PHOTO */

  document.getElementById("profilPhoto").src =
    localStorage.getItem("customAvatar")
    || user.photoURL;

  /* NOM */

  document.getElementById("profilNom").innerText =
    user.displayName;

  /* EMAIL */

  document.getElementById("profilEmail").innerText =
    user.email;

  /* CHARGEMENT DES LIKES */

  chargerLikes(user.uid);

});

async function chargerLikes(uid){

  const container =
    document.getElementById("likesContainer");

  container.innerHTML = "";

  const ref = doc(db, "userLikes", uid);

  const snap = await getDoc(ref);

  if(!snap.exists()){

    container.innerHTML = `
      <div class="placeholder">
        Aucun profil liké pour le moment ❤️
      </div>
    `;

    return;
  }

  const data = snap.data();

  let nombreLikes = 0;

  for(const profilId in data){

    if(data[profilId] !== true) continue;

    nombreLikes++;

    const profil = profils[profilId];

    if(!profil) continue;

    const carte = document.createElement("div");

    carte.className = "carte";

    carte.innerHTML = `
      <img src="${profil.photo}">
      <h3>${profil.nom}</h3>

      <a href="${profil.lien}"
         class="bouton">
         Voir le profil
      </a>
    `;

    container.appendChild(carte);
  }

  if(nombreLikes === 0){

    container.innerHTML = `
      <div class="placeholder">
        Aucun profil liké pour le moment ❤️
      </div>
    `;
  }
}

</script>
</body>
</html>
