<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<link rel="icon" href="Photo de profil/logo XSU XZENX.jpg">
<title>XSU LIFEZEN - Réseaux</title>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#f5f5f5,#e8e8e8);
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  background:white;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.home-img{
  width:140px;
  transition:0.3s;
}

.home-img:hover{
  transform:scale(1.08);
}

/* PROFIL */
.profil{
  text-align:center;
  margin-top:30px;
}

.profil img{
  width:175px;
  border-radius:15px;
}

.profil h1{
  margin-top:10px;
}

/* GALERIE */
.galerie{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
  padding:40px;
}

/* CARTE IMAGE */
.reseau{
  width:280px;
  height:160px;
  border-radius:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  box-shadow:0 10px 25px rgba(0,0,0,0.18);
  transition:0.3s;

  user-select:none;
}

.reseau:hover{
  transform:translateY(-8px) scale(1.02);
}

.overlay{
  text-align:center;
  color:white;
}

.overlay h2{
  margin-bottom:8px;
}

.overlay p{
  color:white;
  margin-bottom:12px;
}

.btn{
  display:inline-block;
  padding:10px 18px;
  background:black;
  color:white;
  text-decoration:none;
  border-radius:10px;
  transition:0.3s;
}

.btn:hover{
  background:#333;
  transform:scale(1.05);
}

/* IMAGES */
.youtube{
  background:
  linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
  url("Photo de profil/youtube.jpg");
  background-size:cover;
  background-position:center;
}

.tiktok{
  background:
  linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
  url("Photo de profil/tiktok.jpg");
  background-size:cover;
  background-position:center;
}

.discord{
  background:
  linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
  url("Photo de profil/discord.jpg");
  background-size:cover;
  background-position:center;
}

.paypal{
  background:
  linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
  url("Photo de profil/paypal.jpg");
  background-size:cover;
  background-position:center;
}

/* FOOTER */
.footer{
  margin-top:60px;
  background:white;
  text-align:center;
  padding:30px 20px;
  box-shadow:0 -4px 15px rgba(0,0,0,0.1);

  border-top-left-radius:20px;
  border-top-right-radius:20px;
  border-bottom-left-radius:20px;
  border-bottom-right-radius:20px;
}

.don-widget{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:999;
}

.don-content{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  text-align:center;
}

.don-toggle{
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  background:black;
  color:white;
  font-size:24px;
  cursor:pointer;
  margin-bottom:10px;
}

.dons{
  display:flex;
  gap:15px;
  justify-content:center;
}

.paypal-img{
  width:85px;
  border-radius:12px;
}

.merci{
  font-size:13px;
  color:#666;
  margin-top:10px;
}

</style>
</head>

<body>

<!-- ACCUEIL -->
<div class="topbar">
  <a href="https://huskymichel.github.io/HuskyMichel-site/">
    <img src="Photo de profil/Accueil.jpg" class="home-img" alt="Accueil">
  </a>
</div>

<!-- PROFIL -->
<div class="profil">
  <img src="Photo de profil/Photo de profil XSU XZENX.jpg" alt="XSU LIFEZEN">
  <h1>XSU LIFEZEN</h1>
</div>

<!-- RESEAUX -->
<div class="galerie">

  <div class="reseau youtube">
    <div class="overlay">
      <h2>YouTube</h2>
      <p>Chaîne gaming & contenu</p>
      <a href="https://www.youtube.com/@XSUXZENX" target="_blank" class="btn">Ouvrir</a>
    </div>
  </div>

  <div class="reseau tiktok">
    <div class="overlay">
      <h2>TikTok</h2>
      <p>Clips et vidéos courtes</p>
      <a href="https://www.tiktok.com/@lifezen1?_r=1&_t=ZN-92wzGzfiVMs" target="_blank" class="btn">Voir</a>
    </div>
  </div>

  <div class="reseau discord">
    <div class="overlay">
      <h2>Discord</h2>
      <p>Communauté officielle</p>
      <a href="https://discord.com/invite/SrHZn3aDt8" target="_blank" class="btn">Rejoindre</a>
    </div>
  </div>

  <div class="reseau paypal">
    <div class="overlay">
      <h2>PayPal</h2>
      <p>Soutiens-moi ❤️</p>
      <a href="https://www.paypal.com/paypalme/LinoCassibba288" target="_blank" class="btn">Donner</a>
    </div>
  </div>

</div>

<div style="text-align:center; margin:20px 0 50px 0;">

  <video controls playsinline
         style="width:80%; max-width:900px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,.18);">

    <source src="Vidéo XSU LIFEZEN/Lifezen présentation.mp4" type="video/mp4">

    Votre navigateur ne supporte pas la vidéo.

  </video>

</div>

<!-- DON FLOTTANT -->
<div class="don-widget" id="donWidget">

  <button class="don-toggle" onclick="toggleDon()">💰</button>

  <div class="don-content" id="donContent">

    <h3>💰 Dons</h3>

    <div class="dons">

      <a href="https://www.paypal.com/paypalme/SkaytrozOnYoutube" target="_blank">
        <img src="Photo de profil/paypal logo veenzoxx.jpg" class="paypal-img" alt="PayPal Veenzoxx">
      </a>

      <a href="https://www.paypal.com/paypalme/LinoCassibba288" target="_blank">
        <img src="Photo de profil/paypal logo lifezen.jpg" class="paypal-img" alt="PayPal Lifezen">
      </a>

    </div>

    <p class="merci">Merci pour le soutien ❤️</p>

  </div>
</div>

<script>
function toggleDon(){
  const box = document.getElementById("donContent");

  if(box.style.display === "none"){
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
}
</script>

</body>
</html>
