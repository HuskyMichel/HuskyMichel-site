<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<link rel="icon" href="Photo de profil/logo XSU XZENX.jpg">
<title>XSU LIFEZEN - Réseaux</title>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
}

/* ACCUEIL */
.topbar{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  background:white;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.home-img{
  width:140px;
  transition:0.3s;
}

.home-img:hover{
  transform:scale(1.08);
}

/* PROFIL */
.profil{
  text-align:center;
  margin-top:30px;
}

.profil img{
  width:175px;
  border-radius:15px;
}

.profil h1{
  margin-top:10px;
}

/* GALERIE */
.galerie{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
  padding:40px;
}

.carte{
  width:280px;
  background:white;
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.12);
  transition:0.3s;
}

.carte:hover{
  transform:translateY(-10px) scale(1.02);
}

.carte a{
  display:inline-block;
  margin-top:10px;
  padding:12px 20px;
  background:black;
  color:white;
  text-decoration:none;
  border-radius:10px;
  transition:0.3s;
}

.carte a:hover{
  background:#333;
  transform:scale(1.05);
}

.carte p{
  color:#444;
}

/* FOOTER */
.footer{
  margin-top:60px;
  background:white;
  text-align:center;
  padding:30px 20px;
  box-shadow:0 -4px 15px rgba(0,0,0,0.1);
  border-top-left-radius:20px;
  border-top-right-radius:20px;
}

.footer h3{
  margin-bottom:15px;
}

.dons{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
}

.paypal-img{
  width:110px;
  padding:10px;
  border-radius:15px;
  background:#f5f5f5;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

.paypal-img:hover{
  transform:scale(1.08);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.mini{
  margin-top:15px;
  color:#666;
  font-size:14px;
}

/* RESPONSIVE */
@media (max-width:768px){
  .galerie{
    flex-direction:column;
    align-items:center;
  }

  .carte{
    width:85%;
  }
}

</style>
</head>
