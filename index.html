<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accueil</title>

<link rel="icon" href="Photo de profil/titre.jpg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#1f1f1f;
    color:white;
}

/* ========================= */
/* HEADER */
/* ========================= */

header{

    position:sticky;
    top:0;

    height:60px;

    background:#0f0f0f;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid #2b2b2b;

    z-index:1000;

}

/* ========================= */
/* LOGO */
/* ========================= */

.logo{

    display:flex;
    align-items:center;

}

.logo img{

    height:42px;

    cursor:pointer;

}

/* ========================= */
/* RECHERCHE */
/* ========================= */

.search{

    flex:1;

    display:flex;

    justify-content:center;

}

.search input{

    width:520px;

    max-width:90%;

    background:#151515;

    color:white;

    border:1px solid #333;

    border-radius:30px;

    padding:11px 18px;

    font-size:15px;

    outline:none;

}

.search input:focus{

    border-color:#3ea6ff;

}

/* ========================= */
/* COMPTE */
/* ========================= */

.account{

    display:flex;

    align-items:center;

    gap:12px;

}

/* bouton connexion */

#loginBtn{

    background:#3ea6ff;

    color:white;

    border:none;

    border-radius:25px;

    padding:10px 18px;

    font-size:15px;

    cursor:pointer;

    transition:0.2s;

}

#loginBtn:hover{

    background:#61b8ff;

}

/* ========================= */
/* PHOTO */
/* ========================= */

.profile{

    display:none;

    position:relative;

}

#avatar{

    width:42px;

    height:42px;

    border-radius:50%;

    object-fit:cover;

    cursor:pointer;

    border:2px solid #3ea6ff;

}

/* ========================= */
/* MENU */
/* ========================= */

.menu{

    display:none;

    position:absolute;

    top:55px;

    right:0;

    width:230px;

    background:#242424;

    border-radius:12px;

    overflow:hidden;

    box-shadow:0 0 20px rgba(0,0,0,.5);

}

.menu a,
.menu button{

    width:100%;

    display:block;

    padding:14px;

    background:none;

    border:none;

    color:white;

    text-align:left;

    font-size:15px;

    cursor:pointer;

}

.menu a{

    text-decoration:none;

}

.menu a:hover,
.menu button:hover{

    background:#333;

}

/* ========================= */

main{

    padding:25px;

}

#listeProfils{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));

    gap:25px;

    margin-top:30px;

}

.carteProfil{

    background:#2a2a2a;

    border-radius:18px;

    overflow:hidden;

    transition:.25s;

    cursor:pointer;

}

.carteProfil:hover{

    transform:translateY(-6px);

}

.cartePhoto{

    width:110px;
    height:110px;

    object-fit:cover;

    border-radius:50%;

    display:block;

    margin:25px auto 15px;

    border:4px solid white;

    box-shadow:
        0 0 8px white,
        0 0 18px rgba(255,255,255,0.8);

}

.categoriesCachees{

    display:none;

    flex-wrap:wrap;

    gap:7px;

    width:100%;

    margin-top:5px;

}

.categoriePlus{

    background:#444;

    color:#ddd;

    cursor:pointer;

}

.categoriePlus:hover{

    background:#555;

}
.carteCategories{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:12px;

}

.categorieCarte{

    display:inline-block;

    background:#3ea6ff;

    color:white;

    padding:6px 10px;

    border-radius:20px;

    font-size:13px;

    font-weight:bold;

    box-shadow:
        0 0 6px rgba(62,166,255,0.35);

}

.categoriePlus{

    background:#444;

    color:#ddd;

}

.carteContenu{

    padding:18px;

}

.cartePseudo{

    font-size:22px;

    font-weight:bold;

}

.carteDescription{

    color:#bdbdbd;

    margin:12px 0;

}

.carteLikes{

    color:#3ea6ff;

    font-weight:bold;

}

</style>

</head>

<body>

<header>

<div class="logo">

<a href="https://huskymichel.github.io/HuskyMichel-site/">

<img src="Photo de profil/Accueil.jpg" alt="Accueil">

</a>

</div>

<div class="search">

<input
type="text"
placeholder="🔍 Rechercher un profil..."
>

</div>

<div class="account">

<button id="loginBtn">

Se connecter

</button>

<div class="profile" id="profile">

<img id="avatar">

<div class="menu" id="menu">

<a href="#">👤 Mon profil</a>

<button id="changePhoto">

🖼️ Changer la photo

</button>

<button id="logout">

🚪 Déconnexion

</button>

</div>

</div>

</div>

</header>

<main>

<h1>Bienvenue !</h1>


<h2>Créateurs</h2>

<div id="listeProfils"></div>


</main>

<script type="module" src="index.js"></script>

</body>
</html>
